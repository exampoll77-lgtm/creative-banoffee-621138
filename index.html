<style>
:root{
  --ink:#0F172A;
  --indigo:#0F172A;
  --purple:#7C3AED;
  --purple-hover:#6D28D9;
  --purple-light:#A855F7;
  --purple-light-hover:#9333EA;
  --purple-wash:#F3E8FF;
  --paper:#FFFFFF;
  --paper-alt:#F8F7FF;
  --white:#FFFFFF;
  --slate:#64748B;
  --slate-light:#94A3B8;
  --border:#E9D5FF;
  --border-strong:#D8B4FE;
  --success:#16A34A;
  --success-wash:#DCFCE7;
  --warn:#F59E0B;
  --warn-wash:#FEF3C7;
  --danger:#DC2626;
  --danger-wash:#FEE2E2;
  --new:#1D4ED8;
  --new-wash:#EAF0FE;
  --shadow-sm: 0 1px 2px rgba(15,23,42,0.06);
  --shadow-md: 0 6px 20px rgba(15,23,42,0.08);
  --shadow-lg: 0 20px 48px rgba(15,23,42,0.16);
  --radius: 14px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{outline:2px solid var(--purple); outline-offset:2px;}
img{max-width:100%;}
html,body{overflow-x:hidden; width:100%;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  font-size:15px; line-height:1.55;
}
h1,h2,h3,h4{font-family:'Plus Jakarta Sans',system-ui,sans-serif; margin:0; color:var(--ink); letter-spacing:-0.01em;}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
img{max-width:100%;display:block;}
:focus-visible{outline:2.5px solid var(--purple); outline-offset:2px; border-radius:4px;}
.container{max-width:1180px; margin:0 auto; padding:0 24px;}
@media(max-width:640px){.container{padding:0 16px;}}

/* ---------- Buttons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 22px; border-radius:10px; font-weight:600; font-size:14.5px; border:1.5px solid transparent; transition:all .15s ease; white-space:nowrap;}
.btn-primary{background:var(--purple); color:#fff; box-shadow:0 2px 0 rgba(20,18,59,0.08);}
.btn-primary:hover{background:var(--purple-hover); transform:translateY(-1px);}
.btn-outline{background:transparent; color:var(--ink); border-color:var(--border-strong);}
.btn-outline:hover{border-color:var(--purple); color:var(--purple); background:var(--purple-wash);}
.btn-ghost{background:transparent; color:var(--indigo); padding:10px 14px;}
.btn-ghost:hover{background:var(--purple-wash);}
.btn-sm{padding:8px 14px; font-size:13px; border-radius:8px;}
.btn-danger{background:transparent;color:var(--danger); border-color:var(--danger-wash);}
.btn-danger:hover{background:var(--danger-wash);}
.btn-block{width:100%;}
.btn[disabled]{opacity:.5; cursor:not-allowed;}

/* ---------- Header ---------- */
.site-header{position:sticky; top:0; z-index:50; background:rgba(250,250,249,0.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--border);}
.header-row{display:flex; align-items:center; justify-content:space-between; height:96px; gap:24px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand img{height:84px; width:auto; display:block;}
@media(max-width:640px){.header-row{height:76px;} .brand img{height:64px;}}
@media(max-width:400px){.brand img{height:52px;}}
.nav{display:flex; align-items:center; gap:6px;}
.nav a{padding:9px 13px; border-radius:8px; font-weight:600; font-size:14px; color:var(--slate);}
.nav a:hover, .nav a.active{color:var(--purple); background:var(--purple-wash);}
.header-cta{display:flex; align-items:center; gap:10px;}
.hamburger{display:none; background:none; border:none; padding:8px;}
@media(max-width:920px){ .nav{display:none;} .hamburger{display:block;} .header-cta .btn-outline{display:none;} }
@media(max-width:400px){ .header-cta .btn-primary.btn-sm{padding:8px 12px; font-size:12.5px;} }

/* mobile drawer */
.drawer{position:fixed; inset:0; background:rgba(20,18,59,0.45); z-index:80; display:none;}
.drawer.open{display:block;}
.drawer-panel{position:absolute; top:0; right:0; width:78%; max-width:320px; height:100%; background:#fff; padding:24px; display:flex; flex-direction:column; gap:6px;}
.drawer-panel a{padding:14px 8px; font-weight:600; border-bottom:1px solid var(--border); color:var(--ink);}

/* ---------- Hero ---------- */
.hero{padding:76px 0 64px; background:
  radial-gradient(1100px 420px at 85% -10%, #F3E8FF 0%, rgba(243,232,255,0) 60%),
  var(--paper-alt);}
.hero-inner{display:grid; grid-template-columns:1.15fr .85fr; gap:56px; align-items:center;}
@media(max-width:900px){.hero-inner{grid-template-columns:1fr;} .hero{padding:44px 0 40px;}}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-family:'IBM Plex Mono'; font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--purple); background:var(--purple-wash); padding:6px 12px; border-radius:100px; margin-bottom:20px;}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--purple);}
.hero h1{font-size:46px; line-height:1.1; font-weight:800; letter-spacing:-0.02em;}
@media(max-width:640px){.hero h1{font-size:32px;}}
.hero p.lead{margin-top:18px; font-size:17px; color:var(--slate); max-width:560px;}
.hero-ctas{display:flex; gap:12px; margin-top:28px; flex-wrap:wrap;}
.search-box{margin-top:32px; background:#fff; border:1.5px solid var(--border-strong); border-radius:14px; padding:8px; display:flex; gap:8px; box-shadow:var(--shadow-md); max-width:560px;}
@media(max-width:480px){.search-box{flex-direction:column;} .search-box button{width:100%;}}
.quiz-opt:hover{border-color:var(--purple) !important; background:var(--purple-wash) !important;}
.quiz-cta{display:inline-flex; align-items:center; gap:6px; margin-top:14px; font-size:13.5px; font-weight:700; color:var(--purple); background:none; border:none; cursor:pointer; font-family:inherit; padding:0;}
.quiz-cta:hover{text-decoration:underline;}
.search-box input{flex:1; border:none; outline:none; padding:12px 14px; font-size:15px; font-family:inherit; background:transparent;}
.search-box button{border-radius:9px;}
.hero-stats{display:flex; gap:28px; margin-top:32px; flex-wrap:wrap;}
.hero-stats .stat b{display:block; font-family:'Plus Jakarta Sans'; font-size:24px; font-weight:800; color:var(--ink);}
.hero-stats .stat span{font-size:12.5px; color:var(--slate-light); font-family:'IBM Plex Mono'; text-transform:uppercase; letter-spacing:.04em;}

/* hero visual: ballot / admit-card motif */
.hero-visual{position:relative;}
.admit-card{background:#fff; border:1.5px solid var(--border-strong); border-radius:18px; box-shadow:var(--shadow-lg); padding:0; overflow:hidden; transform:rotate(2deg);}
.admit-card .band{background:linear-gradient(120deg,var(--purple),var(--purple-light)); color:#fff; padding:18px 22px; display:flex; justify-content:space-between; align-items:center;}
.admit-card .band .tag{font-family:'IBM Plex Mono'; font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.85;}
.admit-card .body{padding:22px;}
.admit-card .row{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px dashed var(--border);}
.admit-card .row:last-child{border-bottom:none;}
.admit-card .row .k{color:var(--slate-light); font-size:12.5px; font-family:'IBM Plex Mono'; text-transform:uppercase; letter-spacing:.03em;}
.admit-card .row .v{font-weight:700; font-size:14px;}
.admit-card .stub{border-top:1.5px dashed var(--border-strong); padding:16px 22px; display:flex; justify-content:space-between; align-items:center; position:relative; background:var(--paper-alt);}
.admit-card .stub::before,.admit-card .stub::after{content:"";position:absolute; top:-9px; width:18px; height:18px; border-radius:50%; background:var(--paper);}
.admit-card .stub::before{left:-9px;} .admit-card .stub::after{right:-9px;}
.badge-check{display:inline-flex; align-items:center; gap:6px; color:var(--success); font-weight:700; font-size:13px;}
.float-chip{position:absolute; background:#fff; border:1.5px solid var(--border-strong); box-shadow:var(--shadow-md); border-radius:12px; padding:10px 14px; font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:8px;}
.float-chip.c1{top:-18px; left:-24px; transform:rotate(-4deg);}
.float-chip.c2{bottom:-16px; right:-18px; transform:rotate(3deg);}
@media(max-width:900px){.float-chip{display:none;} .admit-card{transform:none;}}

/* ---------- NEW HOME PAGE (redesign) ---------- */
.home-hero{padding:64px 0 52px; text-align:center; background:
  radial-gradient(1000px 380px at 50% -12%, #F3E8FF 0%, rgba(243,232,255,0) 62%),
  var(--paper);}
.home-hero .container{max-width:760px;}
.home-hero h1{font-size:44px; line-height:1.12; font-weight:800; letter-spacing:-0.02em;}
.home-hero h1 span{color:var(--purple);}
@media(max-width:640px){.home-hero{padding:40px 0 36px;} .home-hero h1{font-size:29px;}}
.home-hero p.lead{margin:16px auto 0; font-size:16.5px; color:var(--slate); max-width:520px;}
.home-hero .search-box{margin:26px auto 0;}
.home-hero .hero-stats{justify-content:center; margin-top:26px;}

.cat-showcase{border:none; border-radius:26px; padding:0; background:none; box-shadow:none;}
@media(max-width:640px){.cat-showcase{padding:0;}}
.cat-showcase-head{text-align:center; max-width:560px; margin:0 auto 30px;}
.cat-showcase-head .kicker{display:block; margin-bottom:8px; font-family:'IBM Plex Mono'; font-size:12px; color:var(--purple); text-transform:uppercase; letter-spacing:.08em; font-weight:600;}
.cat-showcase-head h2{font-size:27px;}
.cat-showcase-head p{color:var(--slate); font-size:14.5px; margin-top:8px;}
.cat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:22px;}
@media(max-width:760px){.cat-grid{grid-template-columns:1fr; gap:14px;}}
.cat-card{border-radius:18px; padding:38px 28px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px; transition:box-shadow .18s ease, transform .18s ease;}
@media(max-width:760px){.cat-card{flex-direction:row; text-align:left; padding:18px; gap:16px; align-items:center;}}
.cat-card:hover{box-shadow:var(--shadow-md); transform:translateY(-3px);}
.cat-card .ic{width:76px; height:76px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; color:var(--purple); box-shadow:var(--shadow-sm); margin-bottom:4px; flex-shrink:0;}
@media(max-width:760px){.cat-card .ic{width:50px; height:50px; margin-bottom:0;} .cat-card .ic svg{width:22px;height:22px;}}
.cat-card h3{font-size:19px; font-weight:800; color:var(--ink);}
@media(max-width:760px){.cat-card h3{font-size:16px;}}
.cat-card p{color:var(--slate); font-size:13.5px; margin:0; line-height:1.55;}
@media(max-width:760px){.cat-card p{font-size:12.5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}}
.cat-card .go{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:15px; margin-top:6px; flex-shrink:0; background:var(--purple);}
@media(max-width:760px){.cat-card .go{width:30px; height:30px; margin-top:0;}}
.cat-card .go span{display:none;}
.cat-card{background:#fff; border:1.5px solid var(--border); box-shadow:var(--shadow-sm);}
.cat-card-img{width:calc(100% + 56px); margin:-38px -28px 4px; max-height:150px; object-fit:cover; border-radius:18px 18px 0 0; display:block;}
.cat-card-ic-mobile{display:none;}
@media(max-width:760px){.cat-card-img{display:none;} .cat-card-ic-mobile{display:flex;}}

.chip-grid{display:flex; flex-wrap:wrap; gap:10px;}
.chip-level-group{margin-bottom:22px;}
.chip-level-group:last-child{margin-bottom:0;}
.chip-level-label{display:block; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--purple); margin-bottom:12px;}
.course-tabs{display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;}
.course-tab{background:#fff; border:1.5px solid var(--border-strong); color:var(--slate); font-weight:700; font-size:14px; padding:10px 20px; border-radius:100px; transition:all .15s ease;}
.course-tab.active{background:var(--ink); color:#fff; border-color:var(--ink);}
.course-tab:not(.active):hover{border-color:var(--purple); color:var(--purple);}
.course-tile-row{display:flex; gap:14px; overflow-x:auto; padding-bottom:6px; scrollbar-width:thin;}
.course-pick{flex:0 0 128px; background:#fff; border:1.5px solid var(--border); border-radius:14px; padding:18px 14px; display:flex; flex-direction:column; align-items:flex-start; gap:8px; transition:box-shadow .15s ease, transform .15s ease;}
.course-pick:hover{box-shadow:var(--shadow-sm); transform:translateY(-2px); border-color:var(--purple);}
.course-pick-ic{width:42px; height:42px; border-radius:11px; background:var(--purple-wash); color:var(--purple); display:flex; align-items:center; justify-content:center;}
.course-pick b{font-size:14px; color:var(--ink); line-height:1.3;}
.course-pick-dur{font-size:11.5px; color:var(--slate-light);}
.preview-strip{display:flex; gap:14px; overflow-x:auto; padding-bottom:6px;}
.preview-card{position:relative; flex:0 0 220px; height:130px; border-radius:14px; display:flex; align-items:flex-end; padding:12px 14px; color:#fff; overflow:hidden; box-shadow:var(--shadow-sm);}
.preview-card::after{content:'';position:absolute; inset:0; background:linear-gradient(0deg, rgba(15,23,42,.75), rgba(15,23,42,.05) 55%);}
.preview-play{position:absolute; top:14px; right:14px; width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.22); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; z-index:1;}
.preview-name{position:relative; z-index:1; font-weight:700; font-size:13.5px; line-height:1.3;}
.sort-chips{display:flex; gap:8px; flex-wrap:wrap; margin:16px 0 22px;}
.sort-chip{background:#fff; border:1.5px solid var(--border-strong); color:var(--slate); font-weight:700; font-size:13px; padding:9px 16px; border-radius:100px; transition:all .15s ease;}
.sort-chip.active{background:var(--purple-wash); color:var(--purple); border-color:var(--purple);}
.sort-chip:not(.active):not([disabled]):hover{border-color:var(--purple); color:var(--purple);}
.sort-chip[disabled]{opacity:.5; cursor:not-allowed;}
.sticky-counsel{display:none;}
@media(max-width:760px){
  .sticky-counsel{display:block; position:fixed; left:0; right:0; bottom:0; z-index:30; padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px)); background:#fff; border-top:1px solid var(--border); box-shadow:0 -6px 20px rgba(15,23,42,.08);}
  body{padding-bottom:76px;}
}
.country-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:20px;}
@media(max-width:900px){.country-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:520px){.country-grid{grid-template-columns:1fr;}}
.country-card{background:#fff; border:1.5px solid var(--border); border-radius:18px; padding:26px 24px; display:flex; flex-direction:column; gap:8px; text-align:center; align-items:center; transition:box-shadow .18s ease, transform .18s ease, border-color .18s ease;}
.country-card:hover{box-shadow:var(--shadow-md); transform:translateY(-3px); border-color:var(--purple);}
.country-card .flag{font-size:40px; line-height:1;}
.country-card h3{font-size:18px; font-weight:700; margin-top:4px;}
.country-card p{color:var(--slate); font-size:13px; margin:0;}
.country-card .go{font-weight:700; color:var(--purple); font-size:13px; margin-top:6px;}
.course-chip{background:#fff; border:1.5px solid var(--border-strong); border-radius:100px; padding:11px 18px; font-size:13.5px; font-weight:700; color:var(--ink); display:inline-flex; align-items:center; gap:8px; transition:all .15s ease;}
.course-chip:hover{border-color:var(--purple); box-shadow:var(--shadow-sm); transform:translateY(-1px);}
.course-chip:hover{border-color:var(--purple); color:var(--purple); background:var(--purple-wash);}
.course-chip .lv{font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--slate-light); text-transform:uppercase; font-weight:600;}

.counsel-banner{background:linear-gradient(120deg,var(--purple),var(--purple-light)); border-radius:20px; padding:40px 44px; display:flex; justify-content:space-between; align-items:center; gap:24px; color:#fff; position:relative; overflow:hidden;}
.counsel-banner::before{content:"";position:absolute; width:280px; height:280px; border-radius:50%; background:rgba(255,255,255,0.08); top:-120px; right:-60px;}
.counsel-banner h2{color:#fff; font-size:25px; margin-bottom:6px; position:relative;}
.counsel-banner p{color:rgba(255,255,255,0.82); margin:0; font-size:14px; position:relative; max-width:420px;}
.counsel-banner .right{position:relative; flex-shrink:0;}
.counsel-banner .btn-primary{background:#fff; color:var(--purple);}
.counsel-banner .btn-primary:hover{background:var(--purple-wash);}
@media(max-width:700px){.counsel-banner{flex-direction:column; text-align:center; padding:32px 24px;}}

.confused-hero{background:#fff; border:1.5px solid var(--border); border-radius:20px; padding:38px 44px; display:flex; align-items:center; gap:40px; position:relative; overflow:hidden; box-shadow:var(--shadow-sm);}
.confused-hero::before{content:"";position:absolute; width:260px; height:260px; border-radius:50%; background:var(--purple-wash); top:-140px; right:-90px; z-index:0;}
.stat-orb{position:relative; z-index:1; flex-shrink:0; width:160px; height:160px; display:flex; align-items:center; justify-content:center;}
.stat-orb .ring{position:absolute; inset:0; width:100%; height:100%;}
.stat-orb .ring circle:first-child{stroke:var(--border) !important;}
.stat-orb .ring circle:last-child{stroke:var(--purple) !important; transition:stroke-dashoffset 1s ease;}
.stat-num{position:relative; text-align:center; display:flex; flex-direction:column; align-items:center; gap:4px; padding:0 16px;}
.stat-num span{font-family:'Plus Jakarta Sans'; font-weight:800; font-size:36px; line-height:1; color:var(--ink);}
.stat-num small{font-size:11px; color:var(--slate-light); line-height:1.3; max-width:110px;}
.confused-copy{position:relative; z-index:1; flex:1; min-width:0;}
.confused-copy h2{color:var(--ink); font-size:26px; margin:6px 0 10px;}
.confused-copy h2 .hi{color:var(--purple);}
.confused-copy p{color:var(--slate); margin:0 0 18px; font-size:14.5px; max-width:480px; line-height:1.6;}
.doubt-chips{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:22px;}
.doubt-chips .dchip{background:var(--purple-wash); border:1px solid var(--border); padding:8px 14px; border-radius:100px; font-size:12.5px; font-weight:600; color:var(--purple);}

.why-section{padding-bottom:8px;}
.why-bar{background:var(--paper-alt); border-radius:18px; padding:26px 30px; text-align:center;}
.why-bar-title{font-family:'Plus Jakarta Sans'; font-weight:800; font-size:20px; color:var(--ink); margin-bottom:20px;}
.why-row{display:flex; flex-wrap:wrap; justify-content:center; gap:34px;}
.why-pill{display:flex; align-items:center; gap:11px; font-size:13.5px; font-weight:600; color:var(--ink);}
.why-pill .badge{width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--purple);}
.why-pill .badge svg{width:20px; height:20px;}
.why-pill .badge.b1{background:var(--purple-wash);}
@media(max-width:640px){.why-row{gap:18px 24px; justify-content:flex-start; text-align:left;} .why-bar{padding:22px 20px;}}
.why-stats{margin-top:30px; background:var(--paper-alt); border-radius:16px; padding:22px 30px; display:flex; justify-content:space-around; flex-wrap:wrap; gap:20px;}
.why-stat{display:flex; align-items:center; gap:12px;}
.why-stat .ic{font-size:24px;}
.why-stat b{font-family:'Plus Jakarta Sans'; font-size:20px; color:var(--ink); display:block;}
.why-stat small{color:var(--slate-light); font-size:12px;}

@media(max-width:760px){
  .confused-hero{flex-direction:column; text-align:center; padding:34px 26px;}
  .confused-copy p{max-width:100%;}
  .doubt-chips{justify-content:center;}
}

/* ---------- Sections ---------- */
.section{padding:64px 0;}
.section-alt{background:var(--paper-alt);}
.wrap-jumpnav{position:sticky; top:96px; z-index:15; background:rgba(255,255,255,.9); backdrop-filter:blur(6px); border-bottom:1px solid var(--border); padding:10px 0;}
.jump-nav{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none;}
.jump-nav::-webkit-scrollbar{display:none;}
.jump-nav a{flex:0 0 auto; background:#fff; border:1.5px solid var(--border-strong); color:var(--slate); font-weight:700; font-size:13.5px; padding:8px 16px; border-radius:100px; white-space:nowrap;}
.jump-nav a:hover{border-color:var(--purple); color:var(--purple);}
@media(max-width:640px){.wrap-jumpnav{top:76px;}}
.section-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:36px; gap:20px; flex-wrap:wrap;}
.section-head .kicker{font-family:'IBM Plex Mono'; font-size:12px; color:var(--purple); text-transform:uppercase; letter-spacing:.08em; font-weight:600; margin-bottom:8px; display:block;}
.section-head h2,.section-head h1{font-size:30px; font-weight:800;}
.section-head p{color:var(--slate); margin-top:8px; max-width:520px;}

/* ---------- College cards (signature: admit-stub card) ---------- */
.grid-colleges{display:grid; grid-template-columns:repeat(3,1fr); gap:22px;}
@media(max-width:980px){.grid-colleges{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-colleges{grid-template-columns:1fr;}}
.ccard{background:#fff; border:1.5px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow-sm); transition:box-shadow .18s ease, transform .18s ease; display:flex; flex-direction:column; position:relative;}
.compare-check{position:absolute; top:10px; left:10px; z-index:5; background:rgba(255,255,255,0.92); backdrop-filter:blur(2px); border:1.5px solid var(--border-strong); border-radius:100px; padding:6px 12px 6px 8px; font-size:11.5px; font-weight:700; color:var(--slate); display:flex; align-items:center; gap:6px; cursor:pointer; transition:all .15s ease;}
.compare-check input{accent-color:var(--purple); width:14px; height:14px;}
.compare-check.on{border-color:var(--purple); color:var(--purple); background:var(--purple-wash);}
.compare-bar{position:fixed; left:0; right:0; bottom:0; z-index:70; background:var(--ink); box-shadow:0 -6px 24px rgba(0,0,0,0.18);}
.compare-bar-inner{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 24px; flex-wrap:wrap;}
.cb-items{display:flex; flex-wrap:wrap; gap:8px;}
.cb-chip{background:rgba(255,255,255,0.1); color:#fff; border-radius:100px; padding:6px 8px 6px 12px; font-size:12.5px; font-weight:600; display:inline-flex; align-items:center; gap:8px;}
.cb-chip button{background:none; border:none; color:rgba(255,255,255,0.6); cursor:pointer; font-size:12px; padding:2px;}
.cb-chip button:hover{color:#fff;}
.cb-actions{display:flex; gap:10px; flex-shrink:0;}
.compare-bar .btn-ghost{color:#fff;}
.compare-modal{max-width:820px; width:96%;}
.faq-list{display:flex; flex-direction:column; gap:10px; margin-top:8px;}
.faq-item{background:#fff; border:1.5px solid var(--border); border-radius:14px; padding:2px 20px; transition:border-color .15s ease;}
.faq-item[open]{border-color:var(--purple);}
.faq-item summary{list-style:none; cursor:pointer; padding:16px 0; font-family:'Plus Jakarta Sans'; font-weight:700; font-size:15px; color:var(--ink); display:flex; align-items:center; justify-content:space-between; gap:12px;}
.faq-item summary::-webkit-details-marker{display:none;}
.faq-item summary .chev{color:var(--purple); font-size:18px; flex-shrink:0; transition:transform .2s ease;}
.faq-item[open] summary .chev{transform:rotate(180deg);}
.faq-item p{color:var(--slate); font-size:14px; line-height:1.65; padding:0 0 18px;}
.ai-badge{display:inline-flex; align-items:center; gap:6px; background:var(--purple-wash); color:var(--purple); font-weight:700; font-size:12px; padding:6px 12px; border-radius:100px;}
.compare-table-wrap{overflow-x:auto;}
.compare-table{width:100%; border-collapse:collapse; font-size:13.5px;}
.compare-table th, .compare-table td{padding:12px 14px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top;}
.compare-table th{font-family:'Plus Jakarta Sans'; font-weight:700; color:var(--ink); min-width:160px;}
.compare-table td.rl{color:var(--slate-light); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap;}
.compare-table .ct-actions a{font-size:12px; font-weight:600; color:var(--purple);}
@media(max-width:640px){.compare-bar-inner{justify-content:center; text-align:center;} .cb-items{justify-content:center;}}
.ccard:hover{box-shadow:var(--shadow-md); transform:translateY(-3px);}
.ccard .art{height:120px; position:relative; display:flex; align-items:center; justify-content:space-between; padding:16px 18px; color:#fff; overflow:hidden;}
.ccard .art .mono-init{font-family:'Plus Jakarta Sans'; font-weight:800; font-size:26px; letter-spacing:.02em;}
.ccard .art .dots{position:absolute; inset:0; opacity:.18; background-image:radial-gradient(circle,#fff 1.4px, transparent 1.4px); background-size:14px 14px;}
.ccard .art .type-pill{position:relative; background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.35); padding:4px 10px; border-radius:100px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
.ccard .art .rating{position:relative; font-family:'IBM Plex Mono'; font-size:12px; font-weight:700; background:rgba(0,0,0,0.18); padding:4px 8px; border-radius:6px;}
.ccard .info{padding:18px 18px 6px;}
.ccard .info h3{font-size:17px; font-weight:700; margin-bottom:4px;}
.ccard .info .loc{color:var(--slate); font-size:13px; display:flex; align-items:center; gap:5px; margin-bottom:10px;}
.ccard .info .courses{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;}
/* ---- Card v2 (Collegedunia-style listing) ---- */
.ccard2 .art{height:140px; display:block; padding:0; text-decoration:none;}
.ccard2 .art .mono-init{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:32px;}
.ccard2 .art .type-pill{position:absolute; top:12px; right:12px;}
.ccard2 .art .art-loc{position:absolute; left:14px; bottom:12px; font-size:12.5px; font-weight:700; text-shadow:0 1px 4px rgba(0,0,0,0.5); display:flex; align-items:center; gap:4px;}
.ccard2 .info{padding:16px 18px 4px;}
.ccard2 .title-row{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.ccard2 .title-row h3{font-size:16.5px; line-height:1.3;}
.ccard2 .title-row h3 a{color:var(--ink);}
.ccard2 .rr{flex-shrink:0; text-align:right;}
.ccard2 .rr .stars{display:block; font-weight:700; color:var(--ink); font-size:13px;}
.ccard2 .rr small{color:var(--slate-light); font-size:11px;}
.ccard2 .fee-line{margin-top:8px; font-size:13.5px; color:var(--slate);}
.ccard2 .fee-line strong{color:var(--purple); font-weight:800;}
.ccard2 .rank-line{margin-top:6px; font-size:12px; color:var(--slate-light);}
.link-rows{margin-top:12px; border-top:1px solid var(--border);}
.link-row{display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left; padding:11px 18px; font-size:13.5px; font-weight:700; color:var(--ink); background:none; border:none; border-bottom:1px solid var(--border); cursor:pointer; font-family:inherit; text-decoration:none;}
.link-row:hover{background:var(--paper-alt);}
.link-row span{color:var(--slate-light); font-weight:400;}
.ccard2 .stub{padding:14px 18px 18px;}
.pill-course{background:var(--purple-wash); color:var(--indigo); font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:100px;}
.pill-course.more{background:var(--paper-alt); color:var(--slate-light);}
.ccard .stub{margin-top:auto; border-top:1.5px dashed var(--border-strong); padding:14px 18px; display:flex; justify-content:space-between; align-items:center; position:relative; background:var(--paper-alt);}
.ccard .stub::before,.ccard .stub::after{content:"";position:absolute; top:-8px; width:16px; height:16px; border-radius:50%; background:var(--paper);}
.ccard .stub::before{left:-8px;} .ccard .stub::after{right:-8px;}
.ccard .stub .fee{font-family:'IBM Plex Mono'; font-weight:600; font-size:13px;}
.ccard .stub .fee small{display:block; color:var(--slate-light); font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; font-family:'Inter'; font-weight:600;}
.ccard .stub-actions{display:flex; gap:8px;}

/* section CTA link */
.link-arrow{font-weight:700; color:var(--purple); font-size:14px; display:inline-flex; align-items:center; gap:6px;}

/* ---------- How it works ---------- */
.steps{display:grid; grid-template-columns:repeat(4,1fr); gap:20px;}
@media(max-width:900px){.steps{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.steps{grid-template-columns:1fr;}}
.step{background:#fff; border:1.5px solid var(--border); border-radius:14px; padding:22px;}
.step .n{width:30px;height:30px;border-radius:8px; background:var(--ink); color:#fff; font-family:'IBM Plex Mono'; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; margin-bottom:14px;}
.step h4{font-size:15.5px; margin-bottom:6px;}
.step p{color:var(--slate); font-size:13.5px; margin:0;}

/* ---------- Filters / listing ---------- */
.listing-layout{display:grid; grid-template-columns:260px 1fr; gap:30px; align-items:start;}
@media(max-width:860px){.listing-layout{grid-template-columns:1fr;}}
.filters{background:#fff; border:1.5px solid var(--border); border-radius:14px; padding:20px; position:sticky; top:96px;}
.filters h4{font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--slate-light); margin-bottom:6px; font-family:'IBM Plex Mono';}
.filter-group{padding:16px 0; border-bottom:1px solid var(--border);}
.filter-group:last-child{border-bottom:none;}
.filter-group label.title{font-weight:700; font-size:13.5px; margin-bottom:10px; display:block;}
.filter-option{display:flex; align-items:center; gap:9px; padding:5px 0; font-size:13.5px; color:var(--slate); cursor:pointer;}
.filter-option input{accent-color:var(--purple); width:15px; height:15px;}
select, .input{width:100%; padding:10px 12px; border:1.5px solid var(--border-strong); border-radius:9px; font-family:inherit; font-size:13.5px; background:#fff; color:var(--ink);}
.listing-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; gap:14px; flex-wrap:wrap;}
.listing-toolbar .count{font-size:13.5px; color:var(--slate);}
.listing-toolbar .sort{display:flex; align-items:center; gap:8px; font-size:13px;}
.listing-toolbar select{width:auto;}
.chips-active{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
.chip-active{background:var(--purple-wash); color:var(--indigo); font-size:12.5px; font-weight:700; padding:6px 10px; border-radius:100px; display:flex; align-items:center; gap:6px;}
.chip-active button{background:none;border:none;color:var(--indigo);font-weight:800;padding:0;line-height:1;}

/* ---------- Empty state ---------- */
.empty-state{text-align:center; padding:60px 20px; background:#fff; border:1.5px dashed var(--border-strong); border-radius:14px;}
.empty-state .glyph{width:52px;height:52px;border-radius:12px;background:var(--purple-wash); color:var(--purple); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-size:22px; font-weight:800;}
.empty-state h3{font-size:16px; margin-bottom:6px;}
.empty-state p{color:var(--slate); font-size:13.5px; max-width:340px; margin:0 auto 18px;}

/* ---------- College detail ---------- */
.breadcrumb{font-size:12.5px; color:var(--slate-light); margin-bottom:14px; display:flex; flex-wrap:wrap; align-items:center; gap:6px;}
.breadcrumb a{color:var(--slate-light);}
.breadcrumb a:hover{color:var(--purple);}
.breadcrumb .sep{color:var(--border-strong);}
.breadcrumb span[aria-current]{color:var(--ink); font-weight:600;}
.detail-hero{padding:0; border-radius:20px; overflow:hidden; position:relative; color:#fff; min-height:260px; display:flex; flex-direction:column; justify-content:flex-end;}
.detail-hero .dots{position:absolute; inset:0; opacity:.15; background-image:radial-gradient(circle,#fff 1.6px, transparent 1.6px); background-size:16px 16px;}
.detail-hero .inner{position:relative; padding:32px; display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px;}
.detail-hero-top{position:relative; padding:22px 32px 0; display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px;}
.detail-logo{width:52px; height:52px; border-radius:12px; background:#fff; color:var(--purple); font-weight:800; font-size:15px; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-sm);}
.badge-row{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;}
.trust-badge{background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.35); color:#fff; font-size:12px; font-weight:600; padding:6px 12px; border-radius:100px; backdrop-filter:blur(4px);}
.detail-hero h1{font-size:30px; color:#fff;}
.detail-hero .sub{opacity:.9; font-size:14px; margin-top:6px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
@media(max-width:640px){
  .detail-hero .inner{padding:20px;}
  .detail-hero-top{padding:16px 20px 0;}
  .detail-hero h1{font-size:22px;}
  .detail-hero .sub{font-size:12.5px; gap:8px 12px;}
  .detail-logo{width:40px; height:40px; font-size:12px; border-radius:10px;}
  .trust-badge{font-size:10.5px; padding:5px 10px;}
  .badge-row{justify-content:flex-start;}
}
.detail-tabs{display:flex; gap:4px; margin:28px 0 22px; border-bottom:1.5px solid var(--border); overflow-x:auto;}
.detail-tabs button{background:none; border:none; padding:12px 16px; font-weight:700; font-size:13.5px; color:var(--slate-light); border-bottom:2.5px solid transparent; white-space:nowrap;}
.detail-tabs button.active{color:var(--purple); border-color:var(--purple);}
.detail-layout{display:grid; grid-template-columns:1fr 320px; gap:32px; align-items:start;}
@media(max-width:900px){.detail-layout{grid-template-columns:1fr;}}
.card-plain{background:#fff; border:1.5px solid var(--border); border-radius:14px; padding:24px;}
.sidebar-mini{margin-top:0; display:flex; gap:14px; align-items:flex-start; padding:20px; border-radius:14px;}
.sidebar-mini-ic{width:48px; height:48px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:23px; flex-shrink:0;}
.sidebar-mini h4{font-size:16px; font-weight:800; margin-bottom:5px; color:var(--ink);}
.sidebar-mini p{font-size:13.5px; color:var(--slate); margin:0 0 12px; line-height:1.55;}
.sidebar-mini a{display:inline-block; font-size:13.5px; font-weight:700; color:#fff; padding:8px 16px; border-radius:100px;}
.sidebar-mini.mini-counsel{background:var(--purple-wash); border:1.5px solid var(--border);}
.sidebar-mini.mini-counsel .sidebar-mini-ic{background:var(--purple); color:#fff;}
.sidebar-mini.mini-counsel a{background:var(--purple);}
.sidebar-mini.mini-loan{background:#FFF7E6; border:1.5px solid #FDE8B8;}
.sidebar-mini.mini-loan .sidebar-mini-ic{background:#F59E0B; color:#fff;}
.sidebar-mini.mini-loan a{background:#D97706;}
.highlight-list{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px;}
@media(max-width:520px){.highlight-list{grid-template-columns:1fr;}}
.highlight-item{display:flex; gap:10px; align-items:flex-start; font-size:13.5px; color:var(--slate);}
.tick{flex:none; width:18px;height:18px;border-radius:5px; background:var(--purple); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; margin-top:1px;}
table.fees-table{width:100%; border-collapse:collapse; margin-top:14px;}
table.fees-table th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--slate-light); font-family:'IBM Plex Mono'; padding:10px 12px; border-bottom:1.5px solid var(--border);}
table.fees-table td{padding:14px 12px; border-bottom:1px solid var(--border); font-size:14px;}
table.fees-table td.fee{font-family:'IBM Plex Mono'; font-weight:600;}
table.fees-table tr:last-child td{border-bottom:none;}
.sidebar-card{position:sticky; top:96px; display:flex; flex-direction:column; gap:16px;}
.gallery-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px;}
.gallery-tile{aspect-ratio:1; border-radius:10px; display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Plus Jakarta Sans'; font-weight:800; font-size:13px; opacity:.9;}

/* ---------- Courses page ---------- */
.grid-courses{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
@media(max-width:900px){.grid-courses{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.grid-courses{grid-template-columns:1fr;}}
.course-tile{background:#fff; border:1.5px solid var(--border); border-radius:14px; padding:20px; transition:.15s;}
.course-tile:hover{border-color:var(--purple-light); box-shadow:var(--shadow-sm);}
.course-tile .lvl{font-family:'IBM Plex Mono'; font-size:11px; color:var(--purple); text-transform:uppercase; letter-spacing:.05em; font-weight:700;}
.course-tile h4{margin:8px 0 6px; font-size:16.5px;}
.course-tile .count{color:var(--slate); font-size:13px;}

/* ---------- Modal / Enquiry ---------- */
.modal-overlay{position:fixed; inset:0; background:rgba(20,18,59,0.5); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px;}
.modal{background:#fff; border-radius:18px; width:100%; max-width:480px; max-height:90vh; overflow-y:auto; box-shadow:var(--shadow-lg);}
.modal-head{padding:22px 24px 0; display:flex; justify-content:space-between; align-items:flex-start;}
.modal-head h3{font-size:19px;}
.modal-head p{color:var(--slate); font-size:13px; margin-top:4px;}
.modal-close{background:var(--paper-alt); border:none; width:30px; height:30px; border-radius:50%; font-size:16px; color:var(--slate);}
.modal-body{padding:20px 24px 24px;}
.value-props{list-style:none; margin:0 0 18px; padding:14px 16px; background:var(--purple-wash); border-radius:12px; display:flex; flex-direction:column; gap:6px;}
.value-props li{font-size:13px; font-weight:600; color:var(--purple);}
.no-spam{text-align:center; font-size:12px; color:var(--slate-light); margin:12px 0 0;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:700; margin-bottom:6px; color:var(--indigo);}
.field textarea{width:100%; padding:10px 12px; border:1.5px solid var(--border-strong); border-radius:9px; font-family:inherit; font-size:13.5px; resize:vertical; min-height:70px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media(max-width:420px){.field-row{grid-template-columns:1fr;}}
.err{color:var(--danger); font-size:12px; margin-top:4px; display:none;}
.field.invalid .input, .field.invalid select{border-color:var(--danger);}
.field.invalid .err{display:block;}
.success-panel{text-align:center; padding:18px 6px 6px;}
.success-panel .glyph{width:56px;height:56px;border-radius:50%; background:var(--success-wash); color:var(--success); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-size:26px;}

/* ---------- Toast ---------- */
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:12px 20px; border-radius:10px; font-size:13.5px; font-weight:600; z-index:200; opacity:0; transition:all .25s ease; pointer-events:none; box-shadow:var(--shadow-lg);}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ---------- Footer ---------- */
.site-footer{background:var(--ink); color:#C9C7DA; padding:56px 0 26px; margin-top:40px;}
.footer-grid{display:grid; grid-template-columns:2fr 1fr 1fr 1fr 1fr; gap:36px;}
@media(max-width:900px){.footer-grid{grid-template-columns:1fr 1fr 1fr;}}
@media(max-width:640px){.footer-grid{grid-template-columns:1fr 1fr;}}
.footer-grid h5{color:#fff; font-family:'IBM Plex Mono'; font-size:12px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:16px;}
.footer-grid a{display:block; padding:6px 0; font-size:13.5px; color:#B5B3CC;}
.footer-grid a:hover{color:#fff;}
.footer-brand{font-family:'Plus Jakarta Sans'; font-weight:800; font-size:20px; color:#fff; margin-bottom:10px;}
.footer-bottom{border-top:1px solid rgba(255,255,255,0.1); margin-top:36px; padding-top:22px; font-size:12.5px; color:#8482A0; display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;}
.confused-fab{position:fixed; right:20px; bottom:20px; z-index:60; display:flex; align-items:center; gap:8px; background:var(--purple); color:#fff; border:none; border-radius:100px; padding:12px 18px 12px 14px; box-shadow:var(--shadow-lg); font-weight:700; font-size:13.5px;}
.confused-fab:hover{background:#6D28D9; transform:translateY(-2px);}
.confused-fab .ic{font-size:18px;}
@media(max-width:640px){.confused-fab .lbl{display:none;} .confused-fab{padding:12px; right:14px; bottom:14px;}}
.has-compare-bar .confused-fab{bottom:78px;}
@media(max-width:640px){.has-compare-bar .confused-fab{bottom:70px;}}

/* ---------- Admin ---------- */
.admin-shell{display:grid; grid-template-columns:230px 1fr; min-height:calc(100vh - 76px);}
@media(max-width:800px){.admin-shell{grid-template-columns:1fr;}}
.admin-side{background:var(--ink); color:#C9C7DA; padding:24px 14px;}
.admin-side .grp{margin-bottom:6px; display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:9px; font-weight:600; font-size:14px; color:#C9C7DA;}
.admin-side .grp:hover{background:rgba(255,255,255,0.06); color:#fff;}
.admin-side .grp.active{background:var(--purple); color:#fff;}
.admin-side .divider{height:1px; background:rgba(255,255,255,0.1); margin:14px 0;}
.admin-main{padding:32px; background:var(--paper-alt);}
.admin-topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:14px;}
.admin-topbar h2{font-size:22px;}
.kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:28px;}
@media(max-width:800px){.kpi-row{grid-template-columns:1fr 1fr;}}
.kpi{background:#fff; border:1.5px solid var(--border); border-radius:14px; padding:18px 20px;}
.kpi .lbl{font-size:12px; color:var(--slate-light); font-family:'IBM Plex Mono'; text-transform:uppercase; letter-spacing:.04em;}
.kpi .val{font-family:'Plus Jakarta Sans'; font-size:26px; font-weight:800; margin-top:6px;}
.admin-table-wrap{background:#fff; border:1.5px solid var(--border); border-radius:14px; overflow:hidden;}
.admin-table{width:100%; border-collapse:collapse;}
.admin-table th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--slate-light); font-family:'IBM Plex Mono'; padding:12px 16px; background:var(--paper-alt); border-bottom:1.5px solid var(--border);}
.admin-table td{padding:13px 16px; border-bottom:1px solid var(--border); font-size:13.5px; vertical-align:middle;}
.admin-table tr:last-child td{border-bottom:none;}
.admin-table tr:hover td{background:#FBFAFF;}
.row-actions{display:flex; gap:6px;}
.status-select{border:1.5px solid var(--border-strong); border-radius:7px; padding:6px 8px; font-size:12.5px; font-family:'Inter'; font-weight:700;}
.badge{display:inline-flex; padding:4px 10px; border-radius:100px; font-size:11.5px; font-weight:700;}
.badge.New{background:var(--new-wash); color:var(--new);}
.badge.Contacted{background:var(--warn-wash); color:var(--warn);}
.badge.Follow-up{background:#FDF4E3; color:#92600A;}
.badge.Converted{background:var(--success-wash); color:var(--success);}
.badge.Closed{background:#F0EFF5; color:var(--slate-light);}
.badge.pub{background:var(--success-wash); color:var(--success);}
.badge.unpub{background:#F0EFF5; color:var(--slate-light);}
.admin-toolbar{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; align-items:center;}
.admin-toolbar select, .admin-toolbar input{width:auto; min-width:140px;}
.admin-login-wrap{min-height:calc(100vh - 76px); display:flex; align-items:center; justify-content:center; background:var(--paper-alt);}
.admin-login-card{background:#fff; border:1.5px solid var(--border); border-radius:18px; padding:36px; width:100%; max-width:380px; box-shadow:var(--shadow-md);}
.hint{font-size:12px; color:var(--slate-light); margin-top:14px; text-align:center; background:var(--paper-alt); padding:10px; border-radius:8px;}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(max-width:560px){.form-grid{grid-template-columns:1fr;}}
.form-grid .full{grid-column:1/-1;}
.course-row{display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr auto; gap:8px; align-items:center; margin-bottom:8px;}
@media(max-width:700px){.course-row{grid-template-columns:1fr 1fr; }}
.mini-x{background:var(--danger-wash); color:var(--danger); border:none; width:30px; height:30px; border-radius:7px; font-weight:800;}
.editor-panel{background:#fff; border:1.5px solid var(--border); border-radius:14px; padding:24px; margin-bottom:20px;}
.editor-panel h3{font-size:16px; margin-bottom:18px;}
.switch{display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-size:13.5px; font-weight:600;}
.switch input{width:36px; height:20px;}
.simple-page{padding:64px 0; max-width:720px;}
.simple-page h1{font-size:32px; margin-bottom:16px;}
.simple-page p{color:var(--slate); margin-bottom:14px;}
/* ---- Education Loan page ---- */
.ln-hero{background:linear-gradient(180deg,#F4F1FF 0%,#FFFFFF 100%);padding:48px 0 32px;}
.ln-hero-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:center;}
@media(max-width:820px){.ln-hero-grid{grid-template-columns:1fr;}}
.ln-tabs{display:inline-flex;background:#fff;border:1.5px solid var(--border);border-radius:100px;padding:5px;gap:4px;margin:6px 0 18px;}
.ln-tab{border:none;background:transparent;padding:10px 20px;border-radius:100px;font-weight:700;font-size:14px;color:var(--slate);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:8px;}
.ln-tab.on{background:var(--purple);color:#fff;}
.ln-cover{background:#fff;border:1.5px solid var(--border);border-radius:18px;padding:24px;box-shadow:var(--shadow-md);}
.ln-cover h3{font-size:16px;margin-bottom:12px;}
.ln-cover ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
.ln-cover li{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--slate);}
.ln-cover li svg{flex:none;color:var(--purple);margin-top:2px;}
.ln-trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:28px;}
.ln-trust>div{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:16px;}
.ln-trust b{display:block;font-size:14.5px;color:var(--ink);margin-bottom:2px;}
.ln-trust span{font-size:13px;color:var(--slate);line-height:1.5;}
.ln-ic{width:42px;height:42px;flex:none;border-radius:12px;background:var(--purple-wash);color:var(--purple);display:flex;align-items:center;justify-content:center;}
.ln-calc{display:grid;grid-template-columns:1.15fr .85fr;gap:24px;background:#fff;border:1.5px solid var(--border);border-radius:20px;padding:28px;box-shadow:var(--shadow-md);}
@media(max-width:820px){.ln-calc{grid-template-columns:1fr;padding:20px;}}
.ln-row{margin-bottom:22px;}
.ln-row .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:13.5px;color:var(--slate);font-weight:600;}
.ln-row .top b{font-size:16px;color:var(--ink);font-family:'Plus Jakarta Sans',sans-serif;}
.ln-row input[type=range]{width:100%;accent-color:var(--purple);}
.ln-result{background:#F7F5FF;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;}
.ln-emi-lbl{font-size:12.5px;color:var(--slate);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.ln-emi{font-family:'Plus Jakarta Sans',sans-serif;font-size:34px;font-weight:800;color:var(--purple);line-height:1.1;}
.ln-donut{width:124px;height:124px;border-radius:50%;margin:4px auto;position:relative;}
.ln-donut::after{content:"";position:absolute;inset:24px;background:#F7F5FF;border-radius:50%;}
.ln-line{display:flex;justify-content:space-between;font-size:13.5px;color:var(--slate);padding:8px 0;border-top:1px solid var(--border);}
.ln-line b{color:var(--ink);}
.ln-line i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;}
.ln-note{font-size:12px;color:var(--slate-light);line-height:1.6;margin:14px 0 0;}
.loan-banner{display:flex;align-items:center;gap:20px;background:linear-gradient(120deg,var(--purple),var(--purple-light));border-radius:20px;padding:28px 32px;color:#fff;}
.loan-banner-ic{width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;}
.loan-banner-txt{flex:1;min-width:200px;}
.loan-banner h2{color:#fff;font-size:21px;margin-bottom:4px;}
.loan-banner p{color:rgba(255,255,255,.85);font-size:13.5px;margin:0;}
.loan-banner .btn-primary{background:#fff;color:var(--purple);}
.loan-banner .btn-primary:hover{background:#F3E8FF;}
@media(max-width:640px){.loan-banner{flex-wrap:wrap;padding:22px;}}
.ln-bank{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;font-weight:700;color:var(--ink);font-size:13.5px;transition:box-shadow .15s ease, transform .15s ease;}
.ln-bank:hover{box-shadow:var(--shadow-sm); transform:translateY(-2px);}
.ln-logo{width:52px;height:52px;border-radius:14px;color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans';}
.ln-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;}
.ln-step{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:22px;}
.ln-step .n{width:32px;height:32px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;margin-bottom:12px;}
.ln-step h3{font-size:16px;margin-bottom:6px;}
.ln-step p{margin:0;font-size:13.5px;color:var(--slate);line-height:1.65;}
.ln-docs{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:720px){.ln-docs{grid-template-columns:1fr;}}
.ln-docs .box{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:22px;}
.ln-docs h3{font-size:16px;margin-bottom:12px;}
.ln-docs ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
.ln-docs li{display:flex;gap:10px;font-size:14px;color:var(--slate);line-height:1.5;}
.ln-docs li svg{flex:none;color:var(--purple);margin-top:2px;}
.ln-promise{background:linear-gradient(135deg,#F3E8FF,#FBFAFF);border:1.5px solid var(--border-strong);border-radius:20px;padding:30px;display:flex;gap:22px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
.ln-promise h2{font-size:22px;margin-bottom:6px;}
.ln-promise p{margin:0;color:var(--slate);font-size:14.5px;max-width:560px;line-height:1.7;}
.ln-faq{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:16px 20px;margin-bottom:10px;}
.ln-faq summary{cursor:pointer;font-weight:700;color:var(--ink);font-size:15px;}
.ln-faq p{margin:10px 0 0;color:var(--slate);font-size:14px;line-height:1.7;}
</style>

function plain(s){ return (s||'').replace(/\s+/g,' ').trim(); }
/* Updates <title>, meta description/keywords, canonical + JSON-LD for the current route.
   Call this once per render() so every page (college, course, blog...) gets its own SEO tags
   without changing the URL scheme — keeps existing hash-based URLs intact for SEO safety. */
const META_DEFAULTS = {
  desc: 'Exampoll helps students discover and compare colleges, universities and online degrees across India and abroad, with free admission counselling.',
  keywords: 'Exampoll, college admission, best colleges in India, online degrees, study abroad, education loan, admission guidance',
  image: 'https://exampoll.online/og-image.png'
};
function clampText(t, max){
  t = plain(t);
  if(t.length <= max) return t;
  const cut = t.slice(0, max-1);
  const sp = cut.lastIndexOf(' ');
  return (sp > max*0.6 ? cut.slice(0, sp) : cut).replace(/[\s,;:.\u2014-]+$/,'') + '\u2026';
}
function clampTitle(t){
  t = plain(t);
  if(t.length <= 65) return t;
  // Too long: drop the middle "\u2014 ..." segment, keep "Name | Exampoll", trim the name if needed.
  const m = t.match(/^(.*?) \u2014 .*? \| (Exampoll)$/);
  if(m){
    const suffix = ' | ' + m[2];
    let name = m[1];
    if((name + suffix).length > 65) name = clampText(name, 65 - suffix.length);
    return name + suffix;
  }
  return clampText(t, 65);
}
function setMeta(title, description, keywords, jsonLd, noindex, extra){
  extra = extra || {};
  title = clampTitle(title);
  document.title = title;
  const site = 'https://exampoll.online';
  const path = (location.pathname || '/').replace(/\/+$/,'');   // no trailing slash
  const canonicalUrl = site + (path || '') + (path ? '' : '/');
  const desc = clampText(description || META_DEFAULTS.desc, 160);
  const img = extra.image || META_DEFAULTS.image;
  const set = (id, attr, val)=>{ const el = document.getElementById(id); if(el && val) el.setAttribute(attr, val); };
  set('meta-desc','content', desc);
  set('meta-keywords','content', keywords || META_DEFAULTS.keywords);
  set('meta-robots','content', noindex ? 'noindex, nofollow' : 'index, follow');
  set('meta-og-title','content', title);
  set('meta-og-desc','content', desc);
  set('meta-og-url','content', canonicalUrl);
  set('meta-og-type','content', extra.type || 'website');
  set('meta-og-image','content', img);
  set('meta-tw-title','content', title);
  set('meta-tw-desc','content', desc);
  set('meta-tw-image','content', img);
  set('meta-canonical','href', canonicalUrl);
  const block = document.getElementById('jsonld-block');
  if(block) block.textContent = jsonLd ? JSON.stringify(jsonLd) : '{}';
}
function notFoundMeta(title, msg){
  // Only mark a page noindex once the real data has loaded. Before that, a
  // real college/blog could look "missing" for a moment and we must not
  // send Google a noindex by mistake.
  if(State.dataReady) setMeta(title, msg, '', null, true);
}

    "name": c.name, "description": plain(c.description),

    "foundingDate": String(c.established||''),

  };

function debounce(fn, ms){
  let t;
  return function(...args){ clearTimeout(t); t = setTimeout(()=>fn.apply(this,args), ms); };
}

async function loadAll(){
  // Fire all network calls in parallel instead of one-by-one — this alone
  // cuts perceived load time roughly 3x since each round trip used to be
  // awaited sequentially.
  const coursesP = sb.from('courses').select('*').order('name').then(r=>r, e=>({error:e}));
  const collegesP = sb.from('colleges').select('*, college_courses(course_id,duration,fee,mode)').order('name').then(r=>r, e=>({error:e}));
  const blogsP = sb.from('blogs').select('*').order('created_at', {ascending:false}).then(r=>r, e=>({error:e}));
  const settingsP = sb.from('site_settings').select('*').then(r=>r, e=>({error:e}));
  const sessionP = sb.auth.getSession().then(r=>r, e=>({error:e}));

  const [coursesRes, collegesRes, blogsRes, settingsRes, sessionRes] = await Promise.all([coursesP, collegesP, blogsP, settingsP, sessionP]);

  try{
    const rows = settingsRes && settingsRes.data;
    if(rows && rows.length){
      rows.forEach(r=>{ if(r.key==='students_guided') State.settings.studentsGuided = r.value; });
    }
  }catch(e){ /* keep defaults if the site_settings table isn't set up yet */ }

  try{
    const blogs = blogsRes && blogsRes.data;
    if(blogs && blogs.length){
      State.blogs = blogs.map(b=>({ id:b.id, slug:b.slug, title:b.title, excerpt:b.excerpt, content:b.content,
        metaTitle: b.meta_title||'', metaDescription: b.meta_description||'', metaKeywords: b.meta_keywords||'',
        coverImage: b.cover_image||'', coverGradient: gradientForSeed(b.title), author: b.author||'Exampoll Team',
        published: b.published!==false, date: b.created_at }));
    }
    // Same fix as colleges below: never auto-write fake seed blog posts into
    // the live database just because a fetch came back empty.
  }catch(e){ /* keep whatever was already loaded; never fabricate blog posts */ }

  try{
    const courses = coursesRes && coursesRes.data;
    if(courses && courses.length){
      State.catalog = courses.map(c=>({ id:c.id, name:c.name, level:c.level, duration:c.duration }));
    } else if(!State.catalog.length){
      State.catalog = seedCourseCatalog();
      saveCatalog();
    }
  }catch(e){ if(!State.catalog.length) State.catalog = seedCourseCatalog(); }

  try{
    const colleges = collegesRes && collegesRes.data;
    if(colleges && colleges.length){
      State.colleges = colleges.map(c=>({
        id:c.id, slug:c.slug, name:c.name, city:c.city, state:c.state, country: c.country||'', type:c.type,
        established:c.established, rating:Number(c.rating), description:c.description,
        highlights: c.highlights || [], published: c.published, abroad: !!c.abroad,
        onlineDegree: !!c.online_degree, address: c.address||'', imageUrl: c.image_url||'',
        reviewCount: c.review_count||0, ranking: c.ranking||'', brochureUrl: c.brochure_url||'',
        placement: c.placement||'', admissionProcess: c.admission_process||'',
        courses: (c.college_courses||[]).map(cc=>({ courseId: cc.course_id, duration: cc.duration, fee: Number(cc.fee), mode: cc.mode }))
      }));
    }
    // NOTE: we used to auto-generate 21 fake demo colleges (seedColleges())
    // and write them straight into the live Supabase table whenever a fetch
    // came back empty. That meant a single network hiccup could silently
    // insert fake listings into the real database. We no longer do that —
    // an empty/failed fetch just means the public pages show nothing until
    // the next successful load. Seed data is only used for local preview
    // testing (see the bottom of this file), never written to Supabase.
  }catch(e){ /* keep whatever was already loaded; never fabricate colleges */ }

  try{
    const session = sessionRes && sessionRes.data;
    // IMPORTANT: admin logs in with email+password. Students will soon verify their
    // mobile via OTP too, which also creates a Supabase Auth session — but that
    // session has no email, only a phone. Only an email-bearing session counts as admin.
    State.adminAuthed = !!(session && session.session && session.session.user && session.session.user.email);
  }catch(e){ State.adminAuthed = false; }

  saveToCache();

  State.enquiries = [];
  if(State.adminAuthed){
    try{
      const { data: enquiries } = await sb.from('enquiries').select('*').order('created_at', { ascending:false });
      State.enquiries = (enquiries||[]).map(e=>({ id:e.id, name:e.name, mobile:e.mobile, email:e.email, course:e.course, college:e.college, location:e.location, qualification:e.qualification, message:e.message, status:e.status, date:e.created_at }));
    }catch(e){}
  }
}
async function saveColleges(){
  try{
    for(const c of State.colleges){
      const row = { id:c.id, slug:c.slug, name:c.name, city:c.city, state:c.state, country:c.country||'', type:c.type, established:c.established, rating:c.rating, description:c.description, highlights:c.highlights, published:c.published, abroad:!!c.abroad, online_degree:!!c.onlineDegree, address:c.address||'', image_url:c.imageUrl||'', placement:c.placement||'', admission_process:c.admissionProcess||'', review_count:c.reviewCount||0, ranking:c.ranking||'', brochure_url:c.brochureUrl||'' };
      const { error: e1 } = await sb.from('colleges').upsert(row);
      if(e1) throw e1;
      await sb.from('college_courses').delete().eq('college_id', c.id);
      if(c.courses && c.courses.length){
        const rows = c.courses.map(cc=>({ college_id:c.id, course_id:cc.courseId, duration:cc.duration, fee:cc.fee, mode:cc.mode }));
        const { error: e2 } = await sb.from('college_courses').insert(rows);
        if(e2) throw e2;
      }
    }
  }catch(e){ showToast('Could not save — try again'); }
}

  try{

}

window.addEventListener('popstate', ()=>{ State.route = currentPath(); State.mobileNavOpen=false; render(); window.scrollTo(0,0); });
function currentPath(){
  // When this file is opened directly (file:// or a phone's content:// download
  // link) there is no real server, so location.pathname is a filesystem path,
  // not "/". Treat that as the homepage instead of showing a false 404 — real
  // path-based routing only applies once the site is actually deployed.
  if(location.protocol !== 'http:' && location.protocol !== 'https:') return '/';
  return location.pathname || '/';
}
function go(path){
  if(currentPath()===path){ State.route=path; render(); window.scrollTo(0,0); return; }
  try{ history.pushState(null, '', path); }catch(e){ /* file:// or content:// — can't change the address bar, still switch the in-app view below */ }
  State.route = path; render(); window.scrollTo(0,0);
}
function setCourseTab(level){ State.courseTab = level; render(); }
function setHomeSort(key){ State.homeSort = key; render(); }
// Intercept clicks on internal links (href starting with "/") so navigation
// uses pushState instead of a full page reload. External links, tel:, mailto:
// and target="_blank" links are left alone. Attached once — survives re-renders
// because #app's innerHTML is replaced but this listener lives on document.
document.addEventListener('click', function(e){
  const a = e.target.closest('a[href]');
  if(!a) return;
  const href = a.getAttribute('href');
  if(!href || href.charAt(0) !== '/' || a.target === '_blank' || a.hasAttribute('download')) return;
  e.preventDefault();
  go(href);
});

  else if(route === '/privacy') { body = pageSimple('Privacy Policy', privacyCopy()); setMeta('Privacy Policy | Exampoll','How Exampoll collects and uses your information when you submit an enquiry, and the choices you have.','exampoll privacy policy'); }
  else if(route === '/terms') { body = pageSimple('Terms & Conditions', termsCopy()); setMeta('Terms & Conditions | Exampoll','Terms and conditions for using Exampoll to discover colleges, courses and admission guidance.','exampoll terms and conditions'); }
  else if(route.startsWith('/admin')) {
    setMeta('Admin', 'Exampoll admin panel.', '', null, true);
    app.innerHTML = pageAdmin();
    attachGlobalHandlers();
    afterRenderHooks();
    restoreFocus(app, focusInfo);
    return;
  }
  else {
    body = pageSimple('Page not found', '<p>Sorry, we could not find the page you are looking for.</p><p><a href="/" style="color:var(--purple);font-weight:700;">Go to the homepage</a> \u00b7 <a href="/colleges" style="color:var(--purple);font-weight:700;">Browse colleges</a> \u00b7 <a href="/education-loan" style="color:var(--purple);font-weight:700;">Education loan</a></p>');
    setMeta('Page Not Found | Exampoll','The page you are looking for does not exist on Exampoll.','',null,true);
  }

  app.innerHTML = header() + body + footer() + mobileDrawer() + compareBar() + compareModalHtml();
  document.body.classList.toggle('has-compare-bar', State.compareIds.length>0);
  attachGlobalHandlers();
  afterRenderHooks();
  restoreFocus(app, focusInfo);
}
function restoreFocus(app, focusInfo){
  if(!focusInfo) return;
  const el = document.getElementById(focusInfo.id);
  if(!el || !app.contains(el)) return;
  el.focus();
  if(typeof focusInfo.start === 'number' && el.setSelectionRange){
    try{ el.setSelectionRange(focusInfo.start, focusInfo.end); }catch(e){}
  }
}

function afterRenderHooks(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    if(el.getAttribute('href') === State.route || (State.route==='/'||State.route==='') && el.getAttribute('href')==='/') el.classList.add('active');
  });
}

function attachGlobalHandlers(){
  const searchForms = document.querySelectorAll('form[data-role="hero-search"]');
  searchForms.forEach(f=> f.onsubmit = (e)=>{ e.preventDefault(); const v = f.querySelector('input').value.trim(); State.listingFilters.q = v; go('/colleges'); });
}

function toggleCompare(id){
  const i = State.compareIds.indexOf(id);
  if(i>-1) State.compareIds.splice(i,1);
  else {
    if(State.compareIds.length>=4){ showToast('You can compare up to 4 colleges at a time'); return; }
    State.compareIds.push(id);
  }
  render();
}
function removeFromCompare(id){ State.compareIds = State.compareIds.filter(x=>x!==id); render(); }
function clearCompare(){ State.compareIds = []; State.compareOpen = false; render(); }
function openCompare(){ if(State.compareIds.length<2){ showToast('Shortlist at least 2 colleges to compare'); return; } State.compareOpen = true; render(); }
function closeCompare(){ State.compareOpen = false; render(); }

function compareBar(){
  if(!State.compareIds.length) return '';
  const list = State.compareIds.map(id=>collegeById(id)).filter(Boolean);
  return `
  <div class="compare-bar">
    <div class="container compare-bar-inner">
      <div class="cb-items">
        ${list.map(c=>`<span class="cb-chip">${esc(c.name)} <button onclick="removeFromCompare('${c.id}')" aria-label="Remove">✕</button></span>`).join('')}
      </div>
      <div class="cb-actions">
        <button class="btn btn-ghost btn-sm" onclick="clearCompare()">Clear</button>
        <button class="btn btn-primary btn-sm" onclick="openCompare()">Compare (${list.length})</button>
      </div>
    </div>
  </div>`;
}

function compareModalHtml(){
  if(!State.compareOpen) return '';
  const list = State.compareIds.map(id=>collegeById(id)).filter(Boolean);
  if(list.length<2) return '';
  const rows = [
    ['City / State', c=>`${esc(c.city)}, ${esc(c.abroad? (c.country||c.state) : c.state)}`],
    ['Type', c=>esc(c.type)],
    ['Established', c=>c.established],
    ['Rating', c=>`★ ${c.rating}`],
    ['Starting Fee', c=>fmtFee(minFee(c))],
    ['Courses Offered', c=>c.courses.slice(0,4).map(x=>esc(courseName(x.courseId))).join(', ') + (c.courses.length>4?` +${c.courses.length-4} more`:'')],
    ['Online Degree?', c=>c.onlineDegree?'Yes':'No'],
    ['Study Abroad?', c=>c.abroad?'Yes':'No']

  return `

      <div class="modal-head">
        <div><h3>Compare Colleges</h3><p>Side-by-side comparison of your shortlisted colleges</p></div>

function applyListingFilters(list){
  const f = State.listingFilters;
  let out = list.filter(c=>{
    if(f.city && c.city !== f.city) return false;
    if(f.courseId && !c.courses.some(x=>x.courseId===f.courseId)) return false;
    if(f.level && !c.courses.some(x=>courseLevel(x.courseId)===f.level)) return false;
    if(f.type && c.type !== f.type) return false;
    if(f.popularOnly && c.rating < 4.4) return false;
    if(f.fee){
      const mf = minFee(c); if(mf==null) return false;
      if(f.fee==='u1' && !(mf < 100000)) return false;
      if(f.fee==='1-3' && !(mf >= 100000 && mf <= 300000)) return false;
      if(f.fee==='3-6' && !(mf > 300000 && mf <= 600000)) return false;
      if(f.fee==='6p' && !(mf > 600000)) return false;
    }
    if(f.q){
      const q = f.q.toLowerCase();
      const hay = (c.name+' '+c.city+' '+c.state+' '+c.courses.map(x=>courseName(x.courseId)).join(' ')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const sort = State.listingSort;
  if(sort==='popular') out.sort((a,b)=>b.rating-a.rating);
  else if(sort==='low') out.sort((a,b)=>(minFee(a)||0)-(minFee(b)||0));
  else if(sort==='high') out.sort((a,b)=>(minFee(b)||0)-(minFee(a)||0));
  else if(sort==='new') out.sort((a,b)=>b.established-a.established);
  return out;
}

    i===items.length-1 ? `<span aria-current="page">${esc(it.name)}</span>` : `<a href="${it.hash}">${esc(it.name)}</a><span class="sep">›</span>`
  ).join('')}</nav>`;
  const jsonLd = { "@context":"https://schema.org","@type":"BreadcrumbList",

  return { html, jsonLd };
}

    ]},
  { key:'fee', type:'chips', showIf:a=>a.where!=='abroad', q:()=>'Yearly budget kitna soch rahe hain (fees)?',

function visibleQuizSteps(answers){ return quizSteps.filter(s=> !s.showIf || s.showIf(answers)); }

function openQuiz(){
  State.quizCtx = { step:0, answers:{} };
  document.getElementById('modal-root').innerHTML = quizModalHTML();
}
function closeQuiz(){ State.quizCtx = null; document.getElementById('modal-root').innerHTML = ''; }
function quizModalHTML(){
  return `<div class="modal-overlay" onclick="if(event.target===this) closeQuiz()"><div class="modal ai-modal" style="padding:26px 24px;">${quizStepHTML()}</div></div>`;
}
function quizStepHTML(){
  const ctx = State.quizCtx;
  const steps = visibleQuizSteps(ctx.answers);
  const s = steps[ctx.step];
  let bars = '';
  for(let i=0;i<steps.length;i++){
    bars += `<div style="height:4px;flex:1;border-radius:4px;background:${i<ctx.step?'var(--purple)':'var(--border)'};"></div>`;
  }
  const qText = typeof s.q==='function' ? s.q(ctx.answers) : s.q;
  let body = '';
  if(s.type==='text'){
    body = `
      <form onsubmit="event.preventDefault(); quizTextNext('${s.key}'); return false;">
        <input class="input" id="quiz-text-input" type="${s.inputType||'text'}" placeholder="${esc(s.placeholder||'')}" autocomplete="off" style="margin-bottom:6px;"/>
        <div id="quiz-text-err" style="display:none;color:#DC2626;font-size:12.5px;margin-bottom:10px;">Please fill this in</div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:6px;">Continue →</button>
      </form>`;
  } else {
    body = '<div>' + s.opts.map(o=>`<button class="quiz-opt" onclick="quizAnswer('${s.key}','${esc(o.val)}')" style="text-align:left;padding:13px 16px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;font-family:inherit;width:100%;margin-bottom:10px;">${esc(o.label)}</button>`).join('') + '</div>';
  }
  return `
    <div class="ai-badge">✨ Exampoll AI</div>
    <div style="display:flex;gap:6px;margin:14px 0 20px;">${bars}</div>
    <p style="font-size:11.5px;font-weight:600;color:var(--purple);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px;">Question ${ctx.step+1} of ${steps.length}</p>
    <h3 style="font-size:19px;font-weight:700;margin:0 0 18px;line-height:1.3;">${qText}</h3>
    ${body}
    <button onclick="closeQuiz()" style="width:100%;text-align:center;padding:8px;border:none;background:none;color:var(--slate-light);font-size:12.5px;cursor:pointer;font-family:inherit;margin-top:4px;">Cancel</button>
  `;
}
function quizTextNext(key){
  const el = document.getElementById('quiz-text-input');
  const val = (el.value||'').trim();
  const errEl = document.getElementById('quiz-text-err');
  if(!val){ errEl.textContent='Please fill this in'; errEl.style.display='block'; el.focus(); return; }
  if(key==='mobile' && !validMobile(val)){ errEl.textContent='Enter a valid 10-digit mobile number'; errEl.style.display='block'; el.focus(); return; }
  State.quizCtx.answers[key] = val;
  advanceQuiz();
}
function quizAnswer(key, val){
  State.quizCtx.answers[key] = val;
  advanceQuiz();
}
function advanceQuiz(){
  const ctx = State.quizCtx;
  ctx.step++;
  const steps = visibleQuizSteps(ctx.answers);
  if(ctx.step >= steps.length){ quizFinish(); return; }
  document.getElementById('modal-root').innerHTML = quizModalHTML();
  const input = document.getElementById('quiz-text-input');
  if(input) input.focus();
}
async function quizFinish(){
  const a = State.quizCtx.answers;
  const courseMap = {
    'science-UG':'crs-btech-cse', 'science-PG':'crs-mtech-cse', 'science-':'crs-btech-cse',
    'business-UG':'crs-bba', 'business-PG':'crs-mba', 'business-':'crs-bba',
    'commerce-UG':'crs-bcom', 'commerce-PG':'crs-ma-eco', 'commerce-':'crs-bcom',
    'arts-UG':'crs-ba-jmc', 'arts-PG':'crs-ma-eco', 'arts-':'crs-ba-jmc'
  };
  let courseId = a.subject ? (courseMap[a.subject+'-'+(a.level||'')] || '') : '';
  if(a.where==='online'){
    if(courseId==='crs-mba') courseId='crs-online-mba';
    if(courseId==='crs-bba') courseId='crs-online-bba';
  }
  // Build a readable summary for the counsellor from every answer collected
  const summaryParts = [];
  if(a.level) summaryParts.push(`Level: ${a.level}`);
  if(a.qualification) summaryParts.push(`Current qualification: ${a.qualification}`);
  if(a.where) summaryParts.push(`Study mode: ${a.where==='abroad'?'Study Abroad':a.where==='online'?'Online':'India campus'}`);
  if(a.country) summaryParts.push(`Preferred country: ${a.country}`);
  if(a.examStatus) summaryParts.push(`English exam status: ${a.examStatus}`);
  if(a.intake) summaryParts.push(`Target intake: ${a.intake}`);
  if(a.fee) summaryParts.push(`Yearly fee budget: ${a.fee}`);
  if(a.feeAbroad) summaryParts.push(`Total abroad budget: ${a.feeAbroad}`);
  summaryParts.push(a.mobileVerified? 'Mobile: OTP-verified ✓' : 'Mobile: not verified');
  const message = 'Exampoll AI quiz — ' + summaryParts.join(' · ');

  const rec = {
    id: uid('enq'), name: a.name||'', mobile: a.mobile||'', email: '',
    course: courseId ? courseName(courseId) : '', college: '',
    location: '', qualification: a.qualification||'', message, date: new Date().toISOString(), status:'New'
  };
  try{
    const { error } = await sb.from('enquiries').insert([{
      id: rec.id, name: rec.name, mobile: rec.mobile, email: rec.email, course: rec.course,
      college: rec.college, location: rec.location, qualification: rec.qualification,
      message: rec.message, status: rec.status
    }]);
    if(error) throw error;
    State.enquiries.unshift(rec);
  }catch(err){ /* even if saving fails, still show results — don't block the student */ }

  State.listingFilters = { city:'', courseId, level:a.level||'', fee:a.fee||'', type:a.where==='abroad'?'Foreign':'', popularOnly:false, q:'' };

  document.getElementById('modal-root').innerHTML = `
  <div class="modal-overlay" onclick="if(event.target===this) closeQuiz()">
    <div class="modal ai-modal success-panel" style="padding:30px 26px;text-align:center;">
      <div class="ai-badge" style="margin:0 auto 14px;">✨ Exampoll AI</div>
      <div class="glyph">✓</div>
      <h3 style="margin-top:12px;">Shukriya, ${esc(a.name||'')}!</h3>
      <p style="color:var(--slate);margin-top:8px;">Aapke jawabon ke hisaab se colleges dhoondh liye hain, aur ek counsellor bhi jaldi call karega.</p>
      <button class="btn btn-primary btn-block" style="margin-top:20px;" onclick="closeQuiz();go('/colleges');">Matching Colleges Dekhein →</button>
    </div>
  </div>`;
}

          </div>

                ${State.colleges.map(c=>`<option value="${c.id}" ${ctx.collegeId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}

function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
function validMobile(v){ return /^[6-9]\d{9}$/.test(v.replace(/\D/g,'').slice(-10)); }
async function submitEnquiry(e){
  e.preventDefault();
  const form = e.target;
  const name = form.name.value.trim();
  const mobile = document.getElementById('enq-mobile').value.trim();
  const email = form.email.value.trim();
  let ok = true;
  form.querySelectorAll('.field[data-f]').forEach(f=>f.classList.remove('invalid'));
  if(!name){ form.querySelector('[data-f="name"]').classList.add('invalid'); ok=false; }
  if(!validMobile(mobile)){ form.querySelector('[data-f="mobile"]').classList.add('invalid'); ok=false; }
  if(!validEmail(email)){ form.querySelector('[data-f="email"]').classList.add('invalid'); ok=false; }
  if(!ok) return false;
  const rec = {
    id: uid('enq'), name, mobile, email,
    course: form.course.value ? courseName(form.course.value) : '',
    college: form.college.value ? collegeById(form.college.value).name : '',
    location: '', qualification: '', message: '', date: new Date().toISOString(), status:'New'
  };
  try{
    const { error } = await sb.from('enquiries').insert([{
      id: rec.id, name: rec.name, mobile: rec.mobile, email: rec.email, course: rec.course,
      college: rec.college, location: rec.location, qualification: rec.qualification,
      message: rec.message, status: rec.status
    }]);
    if(error) throw error;
  }catch(err){ showToast('Could not submit — please try again'); return false; }
  State.enquiries.unshift(rec);
  State.enquiryCtx.submitted = true;
  renderModal();
  return false;
}

async function uploadImageTo(input, bucket, hiddenId, previewId){
  const file = input.files && input.files[0];
  if(!file) return;
  const preview = document.getElementById(previewId);
  preview.innerHTML = 'Uploading…';
  try{
    const path = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'')}`;
    const { error } = await sb.storage.from(bucket).upload(path, file, { upsert:true });
    if(error) throw error;
    const { data } = sb.storage.from(bucket).getPublicUrl(path);
    document.getElementById(hiddenId).value = data.publicUrl;
    preview.innerHTML = `<img src="${data.publicUrl}" alt="Uploaded preview" style="height:80px;border-radius:8px;"/>`;
    showToast('Image uploaded');
  }catch(err){
    preview.innerHTML = '';
    showToast(`Upload failed: ${(err && err.message) || `check the "${bucket}" bucket exists`}`);
  }
}
async function uploadCollegeBrochure(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const preview = document.getElementById('f-brochure-preview');
  preview.innerHTML = 'Uploading…';
  try{
    const path = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'')}`;
    const { error } = await sb.storage.from('college-brochures').upload(path, file, { upsert:true });

    preview.innerHTML = `<a href="${data.publicUrl}" target="_blank" rel="noopener">📄 Brochure uploaded — open</a>`;
