<style>
:root{
  --ink:#0B0A2E;
  --indigo:#001A62;
  --purple:#601799;
  --purple-light:#9B5FC7;
  --purple-wash:#F1E7FB;
  --paper:#FAFAF9;
  --paper-alt:#F6F5FB;
  --white:#FFFFFF;
  --slate:#5B5A72;
  --slate-light:#8B899E;
  --border:#E6E3F1;
  --border-strong:#D8D4EB;
  --success:#15803D;
  --success-wash:#EAF7EF;
  --warn:#B45309;
  --warn-wash:#FEF3E2;
  --danger:#B91C1C;
  --danger-wash:#FDECEC;
  --new:#1D4ED8;
  --new-wash:#EAF0FE;
  --shadow-sm: 0 1px 2px rgba(20,18,59,0.06);
  --shadow-md: 0 6px 20px rgba(20,18,59,0.08);
  --shadow-lg: 0 20px 48px rgba(20,18,59,0.16);
  --radius: 16px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{overflow-x:hidden; width:100%;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  font-size:15px; line-height:1.55;
}
h1,h2,h3,h4{font-family:'Sora',system-ui,sans-serif; margin:0; color:var(--ink); letter-spacing:-0.01em;}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
img{max-width:100%;display:block;}
:focus-visible{outline:2.5px solid var(--purple); outline-offset:2px; border-radius:4px;}
.container{max-width:1180px; margin:0 auto; padding:0 24px;}
@media(max-width:640px){.container{padding:0 16px;}}

/* ---------- Buttons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 22px; border-radius:10px; font-weight:600; font-size:14.5px; border:1.5px solid transparent; transition:all .15s ease; white-space:nowrap;}
.btn-primary{background:var(--purple); color:#fff; box-shadow:0 2px 0 rgba(20,18,59,0.08);}
.btn-primary:hover{background:#6D28D9; transform:translateY(-1px);}
.btn-outline{background:transparent; color:var(--ink); border-color:var(--border-strong);}
.btn-outline:hover{border-color:var(--purple); color:var(--purple);}
.btn-ghost{background:transparent; color:var(--indigo); padding:10px 14px;}
.btn-ghost:hover{background:var(--purple-wash);}
.btn-sm{padding:8px 14px; font-size:13px; border-radius:8px;}
.btn-danger{background:transparent;color:var(--danger); border-color:var(--danger-wash);}
.btn-danger:hover{background:var(--danger-wash);}
.btn-block{width:100%;}
.btn[disabled]{opacity:.5; cursor:not-allowed;}

/* ---------- Header ---------- */
.site-header{position:sticky; top:0; z-index:50; background:rgba(250,250,249,0.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--border);}
.header-row{display:flex; align-items:center; justify-content:space-between; height:96px; gap:24px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand img{height:84px; width:auto; display:block;}
@media(max-width:640px){.header-row{height:76px;} .brand img{height:64px;}}
@media(max-width:400px){.brand img{height:52px;}}
.nav{display:flex; align-items:center; gap:6px;}
.nav a{padding:9px 13px; border-radius:8px; font-weight:600; font-size:14px; color:var(--slate);}
.nav a:hover, .nav a.active{color:var(--purple); background:var(--purple-wash);}
.header-cta{display:flex; align-items:center; gap:10px;}
.hamburger{display:none; background:none; border:none; padding:8px;}
@media(max-width:920px){ .nav{display:none;} .hamburger{display:block;} .header-cta .btn-outline{display:none;} }
@media(max-width:400px){ .header-cta .btn-primary.btn-sm{padding:8px 12px; font-size:12.5px;} }

/* mobile drawer */
.drawer{position:fixed; inset:0; background:rgba(20,18,59,0.45); z-index:80; display:none;}
.drawer.open{display:block;}
.drawer-panel{position:absolute; top:0; right:0; width:78%; max-width:320px; height:100%; background:#fff; padding:24px; display:flex; flex-direction:column; gap:6px;}
.drawer-panel a{padding:14px 8px; font-weight:600; border-bottom:1px solid var(--border); color:var(--ink);}

/* ---------- Hero ---------- */
.hero{padding:76px 0 64px; background:
  radial-gradient(1100px 420px at 85% -10%, #EDE7FF 0%, rgba(237,231,255,0) 60%),
  var(--paper);}
.hero-inner{display:grid; grid-template-columns:1.15fr .85fr; gap:56px; align-items:center;}
@media(max-width:900px){.hero-inner{grid-template-columns:1fr;} .hero{padding:44px 0 40px;}}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-family:'IBM Plex Mono'; font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--purple); background:var(--purple-wash); padding:6px 12px; border-radius:100px; margin-bottom:20px;}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--purple);}
.hero h1{font-size:46px; line-height:1.1; font-weight:800; letter-spacing:-0.02em;}
@media(max-width:640px){.hero h1{font-size:32px;}}
.hero p.lead{margin-top:18px; font-size:17px; color:var(--slate); max-width:560px;}
.hero-ctas{display:flex; gap:12px; margin-top:28px; flex-wrap:wrap;}
.search-box{margin-top:32px; background:#fff; border:1.5px solid var(--border-strong); border-radius:14px; padding:8px; display:flex; gap:8px; box-shadow:var(--shadow-md); max-width:560px;}
@media(max-width:480px){.search-box{flex-direction:column;} .search-box button{width:100%;}}
.search-box input{flex:1; border:none; outline:none; padding:12px 14px; font-size:15px; font-family:inherit; background:transparent;}
.search-box button{border-radius:9px;}
.hero-stats{display:flex; gap:28px; margin-top:32px; flex-wrap:wrap;}
.hero-stats .stat b{display:block; font-family:'Sora'; font-size:24px; font-weight:800; color:var(--ink);}
.hero-stats .stat span{font-size:12.5px; color:var(--slate-light); font-family:'IBM Plex Mono'; text-transform:uppercase; letter-spacing:.04em;}

/* hero visual: ballot / admit-card motif */
.hero-visual{position:relative;}
.admit-card{background:#fff; border:1.5px solid var(--border-strong); border-radius:18px; box-shadow:var(--shadow-lg); padding:0; overflow:hidden; transform:rotate(2deg);}
.admit-card .band{background:linear-gradient(120deg,var(--indigo),var(--purple)); color:#fff; padding:18px 22px; display:flex; justify-content:space-between; align-items:center;}
.admit-card .band .tag{font-family:'IBM Plex Mono'; font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.85;}
.admit-card .body{padding:22px;}
.admit-card .row{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px dashed var(--border);}
.admit-card .row:last-child{border-bottom:none;}
.admit-card .row .k{color:var(--slate-light); font-size:12.5px; font-family:'IBM Plex Mono'; text-transform:uppercase; letter-spacing:.03em;}
.admit-card .row .v{font-weight:700; font-size:14px;}
.admit-card .stub{border-top:1.5px dashed var(--border-strong); padding:16px 22px; display:flex; justify-content:space-between; align-items:center; position:relative; background:var(--paper-alt);}
.admit-card .stub::before,.admit-card .stub::after{content:"";position:absolute; top:-9px; width:18px; height:18px; border-radius:50%; background:var(--paper);}
.admit-card .stub::before{left:-9px;} .admit-card .stub::after{right:-9px;}
.badge-check{display:inline-flex; align-items:center; gap:6px; color:var(--success); font-weight:700; font-size:13px;}
.float-chip{position:absolute; background:#fff; border:1.5px solid var(--border-strong); box-shadow:var(--shadow-md); border-radius:12px; padding:10px 14px; font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:8px;}
.float-chip.c1{top:-18px; left:-24px; transform:rotate(-4deg);}
.float-chip.c2{bottom:-16px; right:-18px; transform:rotate(3deg);}
@media(max-width:900px){.float-chip{display:none;} .admit-card{transform:none;}}

/* ---------- NEW HOME PAGE (redesign) ---------- */
.home-hero{padding:64px 0 52px; text-align:center; background:
  radial-gradient(1000px 380px at 50% -12%, #EDE7FF 0%, rgba(237,231,255,0) 62%),
  var(--paper);}
.home-hero .container{max-width:760px;}
.home-hero h1{font-size:44px; line-height:1.12; font-weight:800; letter-spacing:-0.02em;}
.home-hero h1 span{color:var(--purple);}
@media(max-width:640px){.home-hero{padding:40px 0 36px;} .home-hero h1{font-size:29px;}}
.home-hero p.lead{margin:16px auto 0; font-size:16.5px; color:var(--slate); max-width:520px;}
.home-hero .search-box{margin:26px auto 0;}
.home-hero .hero-stats{justify-content:center; margin-top:26px;}

.cat-showcase{border:1.5px solid var(--border-strong); border-radius:26px; padding:40px 36px; background:linear-gradient(175deg, var(--purple-wash) 0%, #fff 55%); box-shadow:var(--shadow-md);}
@media(max-width:640px){.cat-showcase{padding:26px 20px; border-radius:20px;}}
.cat-showcase-head{text-align:center; max-width:560px; margin:0 auto 30px;}
.cat-showcase-head .kicker{display:block; margin-bottom:8px; font-family:'IBM Plex Mono'; font-size:12px; color:var(--purple); text-transform:uppercase; letter-spacing:.08em; font-weight:600;}
.cat-showcase-head h2{font-size:27px;}
.cat-showcase-head p{color:var(--slate); font-size:14.5px; margin-top:8px;}
.cat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:22px;}
@media(max-width:760px){.cat-grid{grid-template-columns:1fr;}}
.cat-card{background:#fff; border:1.5px solid var(--border); border-radius:18px; padding:32px 28px; display:flex; flex-direction:column; gap:12px; transition:box-shadow .18s ease, transform .18s ease, border-color .18s ease;}
.cat-card:hover{box-shadow:var(--shadow-md); transform:translateY(-3px); border-color:var(--purple);}
.cat-card .ic{width:62px; height:62px; border-radius:16px; background:linear-gradient(145deg,var(--purple-light),var(--purple)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:28px; box-shadow:0 10px 22px -8px rgba(96,23,153,.4);}
.cat-card h3{font-size:20px; font-weight:700; margin-top:2px;}
.cat-card p{color:var(--slate); font-size:14px; margin:0; flex:1; line-height:1.55;}
.cat-card .go{font-weight:700; color:var(--purple); font-size:14px; display:inline-flex; align-items:center; gap:5px;}

.chip-grid{display:flex; flex-wrap:wrap; gap:10px;}
.course-chip{background:#fff; border:1.5px solid var(--border-strong); border-radius:100px; padding:11px 18px; font-size:13.5px; font-weight:700; color:var(--ink); display:inline-flex; align-items:center; gap:8px; transition:all .15s ease;}
.course-chip:hover{border-color:var(--purple); color:var(--purple); background:var(--purple-wash);}
.course-chip .lv{font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--slate-light); text-transform:uppercase; font-weight:600;}

.counsel-banner{background:linear-gradient(120deg,var(--indigo),var(--purple)); border-radius:20px; padding:40px 44px; display:flex; justify-content:space-between; align-items:center; gap:24px; color:#fff; position:relative; overflow:hidden;}
.counsel-banner::before{content:"";position:absolute; width:280px; height:280px; border-radius:50%; background:rgba(255,255,255,0.08); top:-120px; right:-60px;}
.counsel-banner h2{color:#fff; font-size:25px; margin-bottom:6px; position:relative;}
.counsel-banner p{color:rgba(255,255,255,0.82); margin:0; font-size:14px; position:relative; max-width:420px;}
.counsel-banner .right{position:relative; flex-shrink:0;}
.counsel-banner .btn-primary{background:#fff; color:var(--indigo);}
.counsel-banner .btn-primary:hover{background:#F1E7FB;}
@media(max-width:700px){.counsel-banner{flex-direction:column; text-align:center; padding:32px 24px;}}

/* ---------- Sections ---------- */
.section{padding:64px 0;}
.section-alt{background:var(--paper-alt);}
.section-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:36px; gap:20px; flex-wrap:wrap;}
.section-head .kicker{font-family:'IBM Plex Mono'; font-size:12px; color:var(--purple); text-transform:uppercase; letter-spacing:.08em; font-weight:600; margin-bottom:8px; display:block;}
.section-head h2{font-size:30px; font-weight:800;}
.section-head p{color:var(--slate); margin-top:8px; max-width:520px;}

/* ---------- College cards (signature: admit-stub card) ---------- */
.grid-colleges{display:grid; grid-template-columns:repeat(3,1fr); gap:22px;}
@media(max-width:980px){.grid-colleges{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-colleges{grid-template-columns:1fr;}}
.ccard{background:#fff; border:1.5px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow-sm); transition:box-shadow .18s ease, transform .18s ease; display:flex; flex-direction:column;}
.ccard:hover{box-shadow:var(--shadow-md); transform:translateY(-3px);}
.ccard .art{height:120px; position:relative; display:flex; align-items:center; justify-content:space-between; padding:16px 18px; color:#fff; overflow:hidden;}
.ccard .art .mono-init{font-family:'Sora'; font-weight:800; font-size:26px; letter-spacing:.02em;}
.ccard .art .dots{position:absolute; inset:0; opacity:.18; background-image:radial-gradient(circle,#fff 1.4px, transparent 1.4px); background-size:14px 14px;}
.ccard .art .type-pill{position:relative; background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.35); padding:4px 10px; border-radius:100px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
.ccard .art .rating{position:relative; font-family:'IBM Plex Mono'; font-size:12px; font-weight:700; background:rgba(0,0,0,0.18); padding:4px 8px; border-radius:6px;}
.ccard .info{padding:18px 18px 6px;}
.ccard .info h3{font-size:17px; font-weight:700; margin-bottom:4px;}
.ccard .info .loc{color:var(--slate); font-size:13px; display:flex; align-items:center; gap:5px; margin-bottom:10px;}
.ccard .info .courses{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;}
.pill-course{background:var(--purple-wash); color:var(--indigo); font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:100px;}
.pill-course.more{background:var(--paper-alt); color:var(--slate-light);}
.ccard .stub{margin-top:auto; border-top:1.5px dashed var(--border-strong); padding:14px 18px; display:flex; justify-content:space-between; align-items:center; position:relative; background:var(--paper-alt);}
.ccard .stub::before,.ccard .stub::after{content:"";position:absolute; top:-8px; width:16px; height:16px; border-radius:50%; background:var(--paper);}
.ccard .stub::before{left:-8px;} .ccard .stub::after{right:-8px;}
.ccard .stub .fee{font-family:'IBM Plex Mono'; font-weight:600; font-size:13px;}
.ccard .stub .fee small{display:block; color:var(--slate-light); font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; font-family:'Inter'; font-weight:600;}
.ccard .stub-actions{display:flex; gap:8px;}

/* section CTA link */
.link-arrow{font-weight:700; color:var(--purple); font-size:14px; display:inline-flex; align-items:center; gap:6px;}

/* ---------- How it works ---------- */
.steps{display:grid; grid-template-columns:repeat(4,1fr); gap:20px;}
@media(max-width:900px){.steps{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.steps{grid-template-columns:1fr;}}
.step{background:#fff; border:1.5px solid var(--border); border-radius:14px; padding:22px;}
.step .n{width:30px;height:30px;border-radius:8px; background:var(--ink); color:#fff; font-family:'IBM Plex Mono'; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; margin-bottom:14px;}
.step h4{font-size:15.5px; margin-bottom:6px;}
.step p{color:var(--slate); font-size:13.5px; margin:0;}

/* ---------- Filters / listing ---------- */
.listing-layout{display:grid; grid-template-columns:260px 1fr; gap:30px; align-items:start;}
@media(max-width:860px){.listing-layout{grid-template-columns:1fr;}}
.filters{background:#fff; border:1.5px solid var(--border); border-radius:14px; padding:20px; position:sticky; top:96px;}
.filters h4{font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--slate-light); margin-bottom:6px; font-family:'IBM Plex Mono';}
.filter-group{padding:16px 0; border-bottom:1px solid var(--border);}
.filter-group:last-child{border-bottom:none;}
.filter-group label.title{font-weight:700; font-size:13.5px; margin-bottom:10px; display:block;}
.filter-option{display:flex; align-items:center; gap:9px; padding:5px 0; font-size:13.5px; color:var(--slate); cursor:pointer;}
.filter-option input{accent-color:var(--purple); width:15px; height:15px;}
select, .input{width:100%; padding:10px 12px; border:1.5px solid var(--border-strong); border-radius:9px; font-family:inherit; font-size:13.5px; background:#fff; color:var(--ink);}
.listing-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; gap:14px; flex-wrap:wrap;}
.listing-toolbar .count{font-size:13.5px; color:var(--slate);}
.listing-toolbar .sort{display:flex; align-items:center; gap:8px; font-size:13px;}
.listing-toolbar select{width:auto;}
.chips-active{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
.chip-active{background:var(--purple-wash); color:var(--indigo); font-size:12.5px; font-weight:700; padding:6px 10px; border-radius:100px; display:flex; align-items:center; gap:6px;}
.chip-active button{background:none;border:none;color:var(--indigo);font-weight:800;padding:0;line-height:1;}

/* ---------- Empty state ---------- */
.empty-state{text-align:center; padding:60px 20px; background:#fff; border:1.5px dashed var(--border-strong); border-radius:14px;}
.empty-state .glyph{width:52px;height:52px;border-radius:12px;background:var(--purple-wash); color:var(--purple); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-size:22px; font-weight:800;}
.empty-state h3{font-size:16px; margin-bottom:6px;}
.empty-state p{color:var(--slate); font-size:13.5px; max-width:340px; margin:0 auto 18px;}

/* ---------- College detail ---------- */
.detail-hero{padding:0; border-radius:20px; overflow:hidden; position:relative; color:#fff; min-height:260px; display:flex; flex-direction:column; justify-content:flex-end;}
.detail-hero .dots{position:absolute; inset:0; opacity:.15; background-image:radial-gradient(circle,#fff 1.6px, transparent 1.6px); background-size:16px 16px;}
.detail-hero .inner{position:relative; padding:32px; display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px;}
.detail-hero h1{font-size:30px; color:#fff;}
.detail-hero .sub{opacity:.9; font-size:14px; margin-top:6px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
.detail-tabs{display:flex; gap:4px; margin:28px 0 22px; border-bottom:1.5px solid var(--border); overflow-x:auto;}
.detail-tabs button{background:none; border:none; padding:12px 16px; font-weight:700; font-size:13.5px; color:var(--slate-light); border-bottom:2.5px solid transparent; white-space:nowrap;}
.detail-tabs button.active{color:var(--purple); border-color:var(--purple);}
.detail-layout{display:grid; grid-template-columns:1fr 320px; gap:32px; align-items:start;}
@media(max-width:900px){.detail-layout{grid-template-columns:1fr;}}
.card-plain{background:#fff; border:1.5px solid var(--border); border-radius:14px; padding:24px;}
.highlight-list{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px;}
@media(max-width:520px){.highlight-list{grid-template-columns:1fr;}}
.highlight-item{display:flex; gap:10px; align-items:flex-start; font-size:13.5px; color:var(--slate);}
.tick{flex:none; width:18px;height:18px;border-radius:5px; background:var(--purple); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; margin-top:1px;}
table.fees-table{width:100%; border-collapse:collapse; margin-top:14px;}
table.fees-table th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--slate-light); font-family:'IBM Plex Mono'; padding:10px 12px; border-bottom:1.5px solid var(--border);}
table.fees-table td{padding:14px 12px; border-bottom:1px solid var(--border); font-size:14px;}
table.fees-table td.fee{font-family:'IBM Plex Mono'; font-weight:600;}
table.fees-table tr:last-child td{border-bottom:none;}
.sidebar-card{position:sticky; top:96px;}
.gallery-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px;}
.gallery-tile{aspect-ratio:1; border-radius:10px; display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Sora'; font-weight:800; font-size:13px; opacity:.9;}

/* ---------- Courses page ---------- */
.grid-courses{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
@media(max-width:900px){.grid-courses{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.grid-courses{grid-template-columns:1fr;}}
.course-tile{background:#fff; border:1.5px solid var(--border); border-radius:14px; padding:20px; transition:.15s;}
.course-tile:hover{border-color:var(--purple-light); box-shadow:var(--shadow-sm);}
.course-tile .lvl{font-family:'IBM Plex Mono'; font-size:11px; color:var(--purple); text-transform:uppercase; letter-spacing:.05em; font-weight:700;}
.course-tile h4{margin:8px 0 6px; font-size:16.5px;}
.course-tile .count{color:var(--slate); font-size:13px;}

/* ---------- Modal / Enquiry ---------- */
.modal-overlay{position:fixed; inset:0; background:rgba(20,18,59,0.5); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px;}
.modal{background:#fff; border-radius:18px; width:100%; max-width:480px; max-height:90vh; overflow-y:auto; box-shadow:var(--shadow-lg);}
.modal-head{padding:22px 24px 0; display:flex; justify-content:space-between; align-items:flex-start;}
.modal-head h3{font-size:19px;}
.modal-head p{color:var(--slate); font-size:13px; margin-top:4px;}
.modal-close{background:var(--paper-alt); border:none; width:30px; height:30px; border-radius:50%; font-size:16px; color:var(--slate);}
.modal-body{padding:20px 24px 24px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:700; margin-bottom:6px; color:var(--indigo);}
.field textarea{width:100%; padding:10px 12px; border:1.5px solid var(--border-strong); border-radius:9px; font-family:inherit; font-size:13.5px; resize:vertical; min-height:70px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media(max-width:420px){.field-row{grid-template-columns:1fr;}}
.err{color:var(--danger); font-size:12px; margin-top:4px; display:none;}
.field.invalid .input, .field.invalid select{border-color:var(--danger);}
.field.invalid .err{display:block;}
.success-panel{text-align:center; padding:18px 6px 6px;}
.success-panel .glyph{width:56px;height:56px;border-radius:50%; background:var(--success-wash); color:var(--success); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-size:26px;}

/* ---------- Toast ---------- */
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:12px 20px; border-radius:10px; font-size:13.5px; font-weight:600; z-index:200; opacity:0; transition:all .25s ease; pointer-events:none; box-shadow:var(--shadow-lg);}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ---------- Footer ---------- */
.site-footer{background:var(--ink); color:#C9C7DA; padding:56px 0 26px; margin-top:40px;}
.footer-grid{display:grid; grid-template-columns:2fr 1fr 1fr 1fr 1fr; gap:36px;}
@media(max-width:900px){.footer-grid{grid-template-columns:1fr 1fr 1fr;}}
@media(max-width:640px){.footer-grid{grid-template-columns:1fr 1fr;}}
.footer-grid h5{color:#fff; font-family:'IBM Plex Mono'; font-size:12px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:16px;}
.footer-grid a{display:block; padding:6px 0; font-size:13.5px; color:#B5B3CC;}
.footer-grid a:hover{color:#fff;}
.footer-brand{font-family:'Sora'; font-weight:800; font-size:20px; color:#fff; margin-bottom:10px;}
.footer-bottom{border-top:1px solid rgba(255,255,255,0.1); margin-top:36px; padding-top:22px; font-size:12.5px; color:#8482A0; display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;}

/* ---------- Footer: Confused? Pucho Hum Batayenge ---------- */
.exampoll-help{box-sizing:border-box; width:100%; margin:36px 0 0; padding:22px 24px; border:1px solid rgba(255,255,255,.10); border-radius:16px; background:rgba(255,255,255,0.02); color:#C9C7DA; font-family:'Inter',sans-serif;}
.exampoll-help *{box-sizing:border-box;}
.exampoll-help__content{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(240px,.85fr); gap:28px; align-items:center;}
.exampoll-help__left{display:flex; align-items:center; gap:18px;}
.exampoll-help__badge{flex:0 0 52px; width:52px; height:52px; display:grid; place-items:center; border-radius:50%; background:linear-gradient(145deg,var(--purple-light),var(--purple)); color:#fff; font-size:28px; font-weight:800; line-height:1; box-shadow:0 8px 20px rgba(96,23,153,.28);}
.exampoll-help h2{margin:0 0 6px; color:#fff; font-family:'Sora'; font-size:clamp(18px,2.2vw,24px); line-height:1.2; letter-spacing:-.01em;}
.exampoll-help h2 span{color:var(--purple-light);}
.exampoll-help p{margin:0 0 13px; font-size:13.5px; line-height:1.5; color:#ABA9C6;}
.exampoll-help__btn{display:inline-flex; align-items:center; gap:8px; min-height:38px; padding:9px 16px; border-radius:9px; background:var(--purple); color:#fff; border:none; cursor:pointer; font-size:13px; font-weight:700; font-family:inherit; transition:transform .15s ease, background .15s ease;}
.exampoll-help__btn:hover{background:#7221ad; transform:translateY(-1px);}
.exampoll-help__stats{min-width:0;}
.exampoll-help__stat{display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:12px; line-height:1.35; color:#ABA9C6;}
.exampoll-help__stat strong{color:#fff; font-size:13px; white-space:nowrap; font-family:'IBM Plex Mono';}
.exampoll-help__bar{height:6px; margin-top:6px; overflow:hidden; border-radius:999px; background:rgba(255,255,255,.08);}
.exampoll-help__bar i{display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--purple-light),#C084FC);}
.exampoll-help__stat--second{margin-top:14px;}
.exampoll-help__bottom{margin:18px 0 0; color:#fff; font-size:13px; font-weight:700;}
.exampoll-help__source{display:block; margin-top:7px; color:#7A7896; font-size:10px; line-height:1.4;}
@media(max-width:700px){.exampoll-help{padding:18px; margin-top:28px; border-radius:14px;} .exampoll-help__content{grid-template-columns:1fr; gap:20px;} .exampoll-help__left{align-items:flex-start;} .exampoll-help__badge{flex-basis:44px; width:44px; height:44px; font-size:24px;} .exampoll-help h2{font-size:19px;}}

/* ---------- Admin ---------- */
.admin-shell{display:grid; grid-template-columns:230px 1fr; min-height:calc(100vh - 76px);}
@media(max-width:800px){.admin-shell{grid-template-columns:1fr;}}
.admin-side{background:var(--ink); color:#C9C7DA; padding:24px 14px;}
.admin-side .grp{margin-bottom:6px; display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:9px; font-weight:600; font-size:14px; color:#C9C7DA;}
.admin-side .grp:hover{background:rgba(255,255,255,0.06); color:#fff;}
.admin-side .grp.active{background:var(--purple); color:#fff;}
.admin-side .divider{height:1px; background:rgba(255,255,255,0.1); margin:14px 0;}
.admin-main{padding:32px; background:var(--paper-alt);}
.admin-topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:14px;}
.admin-topbar h2{font-size:22px;}
.kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:28px;}
@media(max-width:800px){.kpi-row{grid-template-columns:1fr 1fr;}}
.kpi{background:#fff; border:1.5px solid var(--border); border-radius:14px; padding:18px 20px;}
.kpi .lbl{font-size:12px; color:var(--slate-light); font-family:'IBM Plex Mono'; text-transform:uppercase; letter-spacing:.04em;}
.kpi .val{font-family:'Sora'; font-size:26px; font-weight:800; margin-top:6px;}
.admin-table-wrap{background:#fff; border:1.5px solid var(--border); border-radius:14px; overflow:hidden;}
.admin-table{width:100%; border-collapse:collapse;}
.admin-table th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--slate-light); font-family:'IBM Plex Mono'; padding:12px 16px; background:var(--paper-alt); border-bottom:1.5px solid var(--border);}
.admin-table td{padding:13px 16px; border-bottom:1px solid var(--border); font-size:13.5px; vertical-align:middle;}
.admin-table tr:last-child td{border-bottom:none;}
.admin-table tr:hover td{background:#FBFAFF;}
.row-actions{display:flex; gap:6px;}
.status-select{border:1.5px solid var(--border-strong); border-radius:7px; padding:6px 8px; font-size:12.5px; font-family:'Inter'; font-weight:700;}
.badge{display:inline-flex; padding:4px 10px; border-radius:100px; font-size:11.5px; font-weight:700;}
.badge.New{background:var(--new-wash); color:var(--new);}
.badge.Contacted{background:var(--warn-wash); color:var(--warn);}
.badge.Follow-up{background:#FDF4E3; color:#92600A;}
.badge.Converted{background:var(--success-wash); color:var(--success);}
.badge.Closed{background:#F0EFF5; color:var(--slate-light);}
.badge.pub{background:var(--success-wash); color:var(--success);}
.badge.unpub{background:#F0EFF5; color:var(--slate-light);}
.admin-toolbar{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; align-items:center;}
.admin-toolbar select, .admin-toolbar input{width:auto; min-width:140px;}
.admin-login-wrap{min-height:calc(100vh - 76px); display:flex; align-items:center; justify-content:center; background:var(--paper-alt);}
.admin-login-card{background:#fff; border:1.5px solid var(--border); border-radius:18px; padding:36px; width:100%; max-width:380px; box-shadow:var(--shadow-md);}
.hint{font-size:12px; color:var(--slate-light); margin-top:14px; text-align:center; background:var(--paper-alt); padding:10px; border-radius:8px;}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(max-width:560px){.form-grid{grid-template-columns:1fr;}}
.form-grid .full{grid-column:1/-1;}
.course-row{display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr auto; gap:8px; align-items:center; margin-bottom:8px;}
@media(max-width:700px){.course-row{grid-template-columns:1fr 1fr; }}
.mini-x{background:var(--danger-wash); color:var(--danger); border:none; width:30px; height:30px; border-radius:7px; font-weight:800;}
.editor-panel{background:#fff; border:1.5px solid var(--border); border-radius:14px; padding:24px; margin-bottom:20px;}
.editor-panel h3{font-size:16px; margin-bottom:18px;}
.switch{display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-size:13.5px; font-weight:600;}
.switch input{width:36px; height:20px;}
.simple-page{padding:64px 0; max-width:720px;}
.simple-page h1{font-size:32px; margin-bottom:16px;}
.simple-page p{color:var(--slate); margin-bottom:14px;}
</style>

function gradientFor(id){ let h=0; for(const c of id) h=(h*31+c.charCodeAt(0))>>>0; return GRADIENTS[h % GRADIENTS.length]; }
function initials(name){ return name.replace(/University|College|of|\(.*\)/g,'').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
function fmtFee(n){ if(n==null||n==='') return '—'; return '₹' + Number(n).toLocaleString('en-IN'); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function debounce(fn, ms){
  let t;
  return function(...args){ clearTimeout(t); t = setTimeout(()=>fn.apply(this,args), ms); };
}
// Full-page re-render is somewhat heavy (it rebuilds the whole #app
// innerHTML), so search boxes debounce it instead of firing on every
// single keystroke — this removes the typing lag people were feeling.
const debouncedRender = debounce(()=>render(), 180);
function onListingSearchInput(v){ State.listingFilters.q = v; debouncedRender(); }
function onEnquirySearchInput(v){ State.enquiryFilters.q = v; debouncedRender(); }

const CACHE_KEY = 'exampoll_cache_v1';

function loadFromCache(){

    const raw = localStorage.getItem(CACHE_KEY);
    if(!raw) return false;
    const parsed = JSON.parse(raw);

async function loadAll(){
  // Fire all network calls in parallel instead of one-by-one — this alone
  // cuts perceived load time roughly 3x since each round trip used to be
  // awaited sequentially.
  const coursesP = sb.from('courses').select('*').order('name').then(r=>r, e=>({error:e}));
  const collegesP = sb.from('colleges').select('*, college_courses(course_id,duration,fee,mode)').order('name').then(r=>r, e=>({error:e}));
  const sessionP = sb.auth.getSession().then(r=>r, e=>({error:e}));

  const [coursesRes, collegesRes, sessionRes] = await Promise.all([coursesP, collegesP, sessionP]);

  try{
    const courses = coursesRes && coursesRes.data;
    if(courses && courses.length){
      State.catalog = courses.map(c=>({ id:c.id, name:c.name, level:c.level, duration:c.duration }));
    } else if(!State.catalog.length){
      State.catalog = seedCourseCatalog();
      saveCatalog();
    }
  }catch(e){ if(!State.catalog.length) State.catalog = seedCourseCatalog(); }

  try{
    const colleges = collegesRes && collegesRes.data;
    if(colleges && colleges.length){
      State.colleges = colleges.map(c=>({
        id:c.id, slug:c.slug, name:c.name, city:c.city, state:c.state, type:c.type,
        established:c.established, rating:Number(c.rating), description:c.description,
        highlights: c.highlights || [], published: c.published, abroad: !!c.abroad,
        courses: (c.college_courses||[]).map(cc=>({ courseId: cc.course_id, duration: cc.duration, fee: Number(cc.fee), mode: cc.mode }))
      }));
    } else if(!State.colleges.length){
      State.colleges = seedColleges();
      saveColleges();
    }
  }catch(e){ if(!State.colleges.length) State.colleges = seedColleges(); }

  try{
    const session = sessionRes && sessionRes.data;
    State.adminAuthed = !!(session && session.session);
  }catch(e){ State.adminAuthed = false; }

  saveToCache();

  State.enquiries = [];
  if(State.adminAuthed){
    try{
      const { data: enquiries } = await sb.from('enquiries').select('*').order('created_at', { ascending:false });
      State.enquiries = (enquiries||[]).map(e=>({ id:e.id, name:e.name, mobile:e.mobile, email:e.email, course:e.course, college:e.college, location:e.location, qualification:e.qualification, message:e.message, status:e.status, date:e.created_at }));
    }catch(e){}
  }
}
async function saveColleges(){
  try{
    for(const c of State.colleges){
      const row = { id:c.id, slug:c.slug, name:c.name, city:c.city, state:c.state, type:c.type, established:c.established, rating:c.rating, description:c.description, highlights:c.highlights, published:c.published, abroad:!!c.abroad };
      const { error: e1 } = await sb.from('colleges').upsert(row);
      if(e1) throw e1;
      await sb.from('college_courses').delete().eq('college_id', c.id);
      if(c.courses && c.courses.length){
        const rows = c.courses.map(cc=>({ college_id:c.id, course_id:cc.courseId, duration:cc.duration, fee:cc.fee, mode:cc.mode }));
        const { error: e2 } = await sb.from('college_courses').insert(rows);
        if(e2) throw e2;
      }
    }
  }catch(e){ showToast('Could not save — try again'); }
}
async function saveCatalog(){
  try{
    for(const c of State.catalog){
      const { error } = await sb.from('courses').upsert({ id:c.id, name:c.name, level:c.level, duration:c.duration });
      if(error) throw error;
    }
  }catch(e){ showToast('Could not save — try again'); }
}

/* ================= RENDER: SHELL ================= */
function render(){
  const app = document.getElementById('app');
  const route = State.route;

  // Preserve focus + cursor position across re-renders. render() rebuilds
  // #app's innerHTML from scratch every time, which used to yank focus
  // out of whatever input the person was typing in (e.g. the search box
  // would drop focus after every single keystroke). We snapshot the
  // focused element's id + selection here and restore it at the end.
  const active = document.activeElement;
  let focusInfo = null;
  if(active && app.contains(active) && active.id && (active.tagName==='INPUT'||active.tagName==='TEXTAREA'||active.tagName==='SELECT')){
    focusInfo = { id: active.id, start: active.selectionStart, end: active.selectionEnd };
  }

  let body = '';
  if(route === '#/' || route === '') body = pageHome();
  else if(route.startsWith('#/colleges')) body = pageCollegeListing();
  else if(route.startsWith('#/college/')) body = pageCollegeDetail(decodeURIComponent(route.split('#/college/')[1]));
  else if(route === '#/courses') body = pageCourses();
  else if(route === '#/study-abroad') body = pageStudyAbroad();
  else if(route.startsWith('#/courses/')) body = pageCourseColleges(decodeURIComponent(route.split('#/courses/')[1]));
  else if(route === '#/about') body = pageSimple('About Exampoll', aboutCopy());
  else if(route === '#/contact') body = pageSimple('Contact Us', contactCopy());
  else if(route === '#/privacy') body = pageSimple('Privacy Policy', privacyCopy());
  else if(route === '#/terms') body = pageSimple('Terms & Conditions', termsCopy());
  else if(route.startsWith('#/admin')) {
    app.innerHTML = pageAdmin();
    attachGlobalHandlers();
    afterRenderHooks();
    restoreFocus(app, focusInfo);
    return;
  }
  else body = pageHome();

  app.innerHTML = header() + body + footer() + mobileDrawer();
  attachGlobalHandlers();
  afterRenderHooks();
  restoreFocus(app, focusInfo);
}
function restoreFocus(app, focusInfo){
  if(!focusInfo) return;
  const el = document.getElementById(focusInfo.id);
  if(!el || !app.contains(el)) return;
  el.focus();
  if(typeof focusInfo.start === 'number' && el.setSelectionRange){
    try{ el.setSelectionRange(focusInfo.start, focusInfo.end); }catch(e){}
  }
}

function afterRenderHooks(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    if(el.getAttribute('href') === State.route || (State.route==='#/'||State.route==='') && el.getAttribute('href')==='#/') el.classList.add('active');
  });
}

function attachGlobalHandlers(){
  const searchForms = document.querySelectorAll('form[data-role="hero-search"]');
  searchForms.forEach(f=> f.onsubmit = (e)=>{ e.preventDefault(); const v = f.querySelector('input').value.trim(); State.listingFilters.q = v; go('#/colleges'); });
}

function applyListingFilters(list){
  const f = State.listingFilters;
  let out = list.filter(c=>{
    if(f.city && c.city !== f.city) return false;
    if(f.courseId && !c.courses.some(x=>x.courseId===f.courseId)) return false;
    if(f.level && !c.courses.some(x=>courseLevel(x.courseId)===f.level)) return false;
    if(f.type && c.type !== f.type) return false;
    if(f.popularOnly && c.rating < 4.4) return false;
    if(f.fee){
      const mf = minFee(c); if(mf==null) return false;
      if(f.fee==='u1' && !(mf < 100000)) return false;
      if(f.fee==='1-3' && !(mf >= 100000 && mf <= 300000)) return false;
      if(f.fee==='3-6' && !(mf > 300000 && mf <= 600000)) return false;
      if(f.fee==='6p' && !(mf > 600000)) return false;
    }
    if(f.q){
      const q = f.q.toLowerCase();
      const hay = (c.name+' '+c.city+' '+c.state+' '+c.courses.map(x=>courseName(x.courseId)).join(' ')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const sort = State.listingSort;
  if(sort==='popular') out.sort((a,b)=>b.rating-a.rating);
  else if(sort==='low') out.sort((a,b)=>(minFee(a)||0)-(minFee(b)||0));
  else if(sort==='high') out.sort((a,b)=>(minFee(b)||0)-(minFee(a)||0));
  else if(sort==='new') out.sort((a,b)=>b.established-a.established);
  return out;
}

function clearListingChip(i){
  const f = State.listingFilters;
  const keys = ['city','courseId','level','type','fee','popularOnly','q'];
  // recompute active in same order as render to find which key to clear
  const active = [];
  if(f.city) active.push('city');
  if(f.courseId) active.push('courseId');
  if(f.level) active.push('level');
  if(f.type) active.push('type');
  if(f.fee) active.push('fee');
  if(f.popularOnly) active.push('popularOnly');
  if(f.q) active.push('q');
  const key = active[i];
  if(key==='popularOnly') f.popularOnly=false; else f[key]='';
  render();
}

function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
function validMobile(v){ return /^[6-9]\d{9}$/.test(v.replace(/\D/g,'').slice(-10)); }
async function submitEnquiry(e){
  e.preventDefault();
  const form = e.target;
  const name = form.name.value.trim();
  const mobile = form.mobile.value.trim();
  const email = form.email.value.trim();
  let ok = true;
  form.querySelectorAll('.field[data-f]').forEach(f=>f.classList.remove('invalid'));
  if(!name){ form.querySelector('[data-f="name"]').classList.add('invalid'); ok=false; }
  if(!validMobile(mobile)){ form.querySelector('[data-f="mobile"]').classList.add('invalid'); ok=false; }
  if(!validEmail(email)){ form.querySelector('[data-f="email"]').classList.add('invalid'); ok=false; }
  if(!ok) return false;
  const rec = {
    id: uid('enq'), name, mobile, email,
    course: form.course.value ? courseName(form.course.value) : '',
    college: form.college.value ? collegeById(form.college.value).name : '',
    location: form.location.value, qualification: form.qualification.value,
    message: form.message.value.trim(), date: new Date().toISOString(), status:'New'
  };
  try{
    const { error } = await sb.from('enquiries').insert([{
      id: rec.id, name: rec.name, mobile: rec.mobile, email: rec.email, course: rec.course,
      college: rec.college, location: rec.location, qualification: rec.qualification,
      message: rec.message, status: rec.status
    }]);
    if(error) throw error;
  }catch(err){ showToast('Could not submit — please try again'); return false; }
  State.enquiries.unshift(rec);
  State.enquiryCtx.submitted = true;
  renderModal();
  return false;
}

/* ================= ADMIN ================= */
async function adminLogin(e){
  e.preventDefault();
  const email = document.getElementById('admin-email').value.trim();
  const pass = document.getElementById('admin-pass').value;
  const errEl = document.getElementById('admin-login-err');
  errEl.style.display='none';
  try{
    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error) throw error;
    State.adminAuthed = true;
    State.adminSection='overview';
    await loadAll();
    render();
  }catch(err){
    errEl.textContent = err && err.message ? err.message : 'Incorrect email or password. Try again.';
    errEl.style.display='block';
  }
  return false;
}
async function adminLogout(){
  try{ await sb.auth.signOut(); }catch(err){}
  State.adminAuthed = false;
  go('#/');
}

function pageAdmin(){
  if(!State.adminAuthed){
    return header() + `
    <div class="admin-login-wrap">
      <div class="admin-login-card">
        <img src="${LOGO_FULL}" alt="Exampoll" style="height:52px;width:auto;margin-bottom:18px;"/>
        <h2 style="margin-bottom:6px;">Admin Login</h2>
        <p style="color:var(--slate);font-size:13.5px;margin-bottom:22px;">Sign in to manage colleges, courses and enquiries.</p>
        <form onsubmit="return adminLogin(event)">
          <div class="field"><label>Admin email</label><input class="input" type="email" id="admin-email" placeholder="you@exampoll.com" autocomplete="off"/></div>
          <div class="field"><label>Admin password</label><input class="input" type="password" id="admin-pass" placeholder="Enter admin password" autocomplete="off"/></div>
          <p id="admin-login-err" style="display:none;color:var(--danger);font-size:12.5px;margin-bottom:10px;">Incorrect password. Try again.</p>
          <button class="btn btn-primary btn-block" type="submit">Sign in</button>
        </form>
        <div class="hint">Secured by Supabase Auth. Sign in with the admin account created in your Supabase project.</div>
      </div>
    </div>` + mobileDrawer();
  }
  const sec = State.adminSection;
  let content = '';
  if(sec==='overview') content = adminOverview();
  else if(sec==='colleges') content = adminColleges();
  else if(sec==='courses') content = adminCourses();
  else if(sec==='enquiries') content = adminEnquiries();

  return header() + `
  <div class="admin-shell">
    <aside class="admin-side">
      <div class="grp ${sec==='overview'?'active':''}" onclick="State.adminSection='overview';render();">📊 Overview</div>
      <div class="grp ${sec==='colleges'?'active':''}" onclick="State.adminSection='colleges';State.adminEditingCollege=null;render();">🏫 Colleges</div>
      <div class="grp ${sec==='courses'?'active':''}" onclick="State.adminSection='courses';State.adminEditingCourse=null;render();">🎓 Courses</div>
      <div class="grp ${sec==='enquiries'?'active':''}" onclick="State.adminSection='enquiries';render();">✉️ Enquiries</div>
      <div class="divider"></div>
      <div class="grp" onclick="go('#/')">← View site</div>
      <div class="grp" onclick="adminLogout()">Log out</div>
    </aside>
    <main class="admin-main">${content}</main>
  </div>` + mobileDrawer();
}

function adminOverview(){
  const newCount = State.enquiries.filter(e=>e.status==='New').length;
  const convertedCount = State.enquiries.filter(e=>e.status==='Converted').length;
  return `
  <div class="admin-topbar"><h2>Overview</h2></div>
  <div class="kpi-row">
    <div class="kpi"><div class="lbl">Colleges</div><div class="val">${State.colleges.length}</div></div>
    <div class="kpi"><div class="lbl">Courses</div><div class="val">${State.catalog.length}</div></div>
    <div class="kpi"><div class="lbl">Total enquiries</div><div class="val">${State.enquiries.length}</div></div>
    <div class="kpi"><div class="lbl">New / Converted</div><div class="val">${newCount} / ${convertedCount}</div></div>
  </div>
  <div class="admin-table-wrap">
    <table class="admin-table">
      <thead><tr><th>Student</th><th>Course</th><th>College</th><th>Date</th><th>Status</th></tr></thead>
      <tbody>
      ${State.enquiries.slice(0,6).map(e=>`<tr>
        <td><strong>${esc(e.name)}</strong><br><span style="color:var(--slate-light);font-size:12px;">${esc(e.mobile)}</span></td>
        <td>${esc(e.course||'—')}</td><td>${esc(e.college||'—')}</td>
        <td>${new Date(e.date).toLocaleDateString('en-IN')}</td>
        <td><span class="badge ${e.status}">${e.status}</span></td>
      </tr>`).join('') || `<tr><td colspan="5" style="text-align:center;padding:30px;color:var(--slate-light);">No enquiries yet</td></tr>`}
      </tbody>
    </table>
  </div>`;
}

/* ---- Admin: Colleges ---- */
function adminColleges(){
  if(State.adminEditingCollege !== null) return adminCollegeEditor(State.adminEditingCollege);
  return `
  <div class="admin-topbar"><h2>Colleges</h2><button class="btn btn-primary" onclick="startNewCollege()">+ Add College</button></div>
  <div class="admin-table-wrap">
    <table class="admin-table">
      <thead><tr><th>College</th><th>Location</th><th>Courses</th><th>Starting Fee</th><th>Status</th><th></th></tr></thead>
      <tbody>
      ${State.colleges.map(c=>`<tr>
        <td><strong>${esc(c.name)}</strong></td>
        <td>${esc(c.city)}, ${esc(c.state)}</td>
        <td>${c.courses.length}</td>
        <td class="mono">${fmtFee(minFee(c))}</td>
        <td><span class="badge ${c.published?'pub':'unpub'}">${c.published?'Published':'Unpublished'}</span></td>
        <td><div class="row-actions">
          <button class="btn btn-outline btn-sm" onclick="editCollege('${c.id}')">Edit</button>
          <button class="btn btn-outline btn-sm" onclick="togglePublish('${c.id}')">${c.published?'Unpublish':'Publish'}</button>
          <button class="btn btn-danger btn-sm" onclick="deleteCollege('${c.id}')">Delete</button>
        </div></td>
      </tr>`).join('') || `<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--slate-light);">No colleges yet — add your first one.</td></tr>`}
      </tbody>
    </table>
  </div>`;
}
function startNewCollege(){
  State.adminEditingCollege = { id:null, name:'', city:'', state:'', type:'Private', established:new Date().getFullYear(), rating:4.0, description:'', highlights:['','','',''], published:true, abroad:false, courses:[] };
  render();
}
function editCollege(id){ State.adminEditingCollege = JSON.parse(JSON.stringify(collegeById(id))); render(); }
function togglePublish(id){ const c = collegeById(id); c.published = !c.published; saveColleges(); render(); showToast(c.published?'College published':'College unpublished'); }
async function deleteCollege(id){
  if(!confirm('Delete this college? This cannot be undone.')) return;
  await deleteCollegeRow(id);
  State.colleges = State.colleges.filter(c=>c.id!==id);
  render(); showToast('College deleted');
}
function adminCollegeEditor(draft){
  const isNew = !draft.id;
  return `
  <div class="admin-topbar"><h2>${isNew?'Add College':'Edit College'}</h2><button class="btn btn-ghost" onclick="State.adminEditingCollege=null;render();">← Back to list</button></div>
  <div class="editor-panel">
    <h3>Basic details</h3>
    <div class="form-grid">
      <div class="field full"><label>College Name</label><input class="input" id="f-name" value="${esc(draft.name)}" placeholder="e.g. Amity University"/></div>
      <div class="field"><label>City</label><input class="input" id="f-city" value="${esc(draft.city)}" placeholder="e.g. Noida"/></div>
      <div class="field"><label>State</label><input class="input" id="f-state" value="${esc(draft.state)}" placeholder="e.g. Uttar Pradesh"/></div>
      <div class="field"><label>University Type</label>
        <select id="f-type"><option ${draft.type==='Private'?'selected':''}>Private</option><option ${draft.type==='Deemed'?'selected':''}>Deemed</option><option ${draft.type==='State-Private'?'selected':''}>State-Private</option><option ${draft.type==='Foreign'?'selected':''}>Foreign</option></select>
      </div>
      <div class="field"><label>Established Year</label><input class="input" id="f-est" type="number" value="${draft.established}"/></div>
      <div class="field"><label>Popularity Rating (0–5)</label><input class="input" id="f-rating" type="number" step="0.1" min="0" max="5" value="${draft.rating}"/></div>
      <div class="field full"><label>Short Description</label><textarea id="f-desc" placeholder="About the college...">${esc(draft.description)}</textarea></div>
      <div class="field full"><label>Highlights (one per line)</label><textarea id="f-highlights" placeholder="NAAC A+ accredited&#10;Strong placement record">${esc(draft.highlights.join(String.fromCharCode(10)))}</textarea></div>
      <div class="field"><label class="switch"><input type="checkbox" id="f-pub" ${draft.published?'checked':''}/> Published (visible to students)</label></div>
      <div class="field"><label class="switch"><input type="checkbox" id="f-abroad" ${draft.abroad?'checked':''}/> Study Abroad (show in foreign-university section)</label></div>
    </div>
  </div>
  <div class="editor-panel">
    <h3>Courses &amp; Fees</h3>
    <div id="course-rows">
      ${draft.courses.map((c,i)=>courseRow(c,i)).join('')}
    </div>
    <button class="btn btn-outline btn-sm" onclick="addCourseRow()">+ Add course</button>
  </div>
  <div style="display:flex;gap:10px;">
    <button class="btn btn-primary" onclick="saveCollegeDraft(${isNew})">Save College</button>
    <button class="btn btn-outline" onclick="State.adminEditingCollege=null;render();">Cancel</button>
  </div>`;
}
function courseRow(c,i){
  return `<div class="course-row" data-row="${i}">
    <select class="cr-course">${State.catalog.map(cc=>`<option value="${cc.id}" ${c.courseId===cc.id?'selected':''}>${esc(cc.name)}</option>`).join('')}</select>
    <input class="input cr-duration" placeholder="Duration" value="${esc(c.duration||'')}"/>
    <input class="input cr-fee" type="number" placeholder="Fee (₹)" value="${c.fee||''}"/>
    <select class="cr-mode"><option ${c.mode==='Full-time'||!c.mode?'selected':''}>Full-time</option><option ${c.mode==='Online'?'selected':''}>Online</option></select>
    <button type="button" class="mini-x" onclick="removeCourseRow(this)">✕</button>
  </div>`;
}
function addCourseRow(){
  const wrap = document.getElementById('course-rows');
  const div = document.createElement('div');
  div.innerHTML = courseRow({courseId:State.catalog[0]?.id||'', duration:'', fee:'', mode:'Full-time'}, wrap.children.length);
  wrap.appendChild(div.firstElementChild);
}
function removeCourseRow(btn){ btn.closest('.course-row').remove(); }
async function saveCollegeDraft(isNew){
  const name = document.getElementById('f-name').value.trim();
  if(!name){ showToast('College name is required'); return; }
  const rows = [...document.querySelectorAll('#course-rows .course-row')].map(r=>({
    courseId: r.querySelector('.cr-course').value,
    duration: r.querySelector('.cr-duration').value.trim(),
    fee: Number(r.querySelector('.cr-fee').value)||0,
    mode: r.querySelector('.cr-mode').value
  }));
  const draft = State.adminEditingCollege;
  const obj = {
    id: draft.id || uid('col'),
    slug: slugify(name), name,
    city: document.getElementById('f-city').value.trim(),
    state: document.getElementById('f-state').value.trim(),
    type: document.getElementById('f-type').value,
    established: Number(document.getElementById('f-est').value)||new Date().getFullYear(),
    rating: Number(document.getElementById('f-rating').value)||4.0,
    description: document.getElementById('f-desc').value.trim(),
    highlights: document.getElementById('f-highlights').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean),
    published: document.getElementById('f-pub').checked,
    abroad: document.getElementById('f-abroad').checked,
    courses: rows
  };
  if(isNew) State.colleges.push(obj);
  else State.colleges = State.colleges.map(c=>c.id===obj.id?obj:c);
  await saveColleges();
  State.adminEditingCollege = null;
  render();
  showToast(isNew?'College added':'College updated');
}

/* ---- Admin: Courses ---- */
function adminCourses(){
  if(State.adminEditingCourse !== null) return adminCourseEditor(State.adminEditingCourse);
  return `
  <div class="admin-topbar"><h2>Courses</h2><button class="btn btn-primary" onclick="startNewCourse()">+ Add Course</button></div>
  <div class="admin-table-wrap">
    <table class="admin-table">
      <thead><tr><th>Course</th><th>Level</th><th>Typical Duration</th><th>Colleges offering</th><th></th></tr></thead>
      <tbody>
      ${State.catalog.map(c=>`<tr>
        <td><strong>${esc(c.name)}</strong></td>
        <td>${esc(c.level)}</td>
        <td>${esc(c.duration)}</td>
        <td>${collegesForCourse(c.id).length}</td>
        <td><div class="row-actions">
          <button class="btn btn-outline btn-sm" onclick="editCourse('${c.id}')">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteCourse('${c.id}')">Delete</button>
        </div></td>
      </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}
function startNewCourse(){ State.adminEditingCourse = { id:null, name:'', level:'UG', duration:'' }; render(); }
function editCourse(id){ State.adminEditingCourse = JSON.parse(JSON.stringify(State.catalog.find(c=>c.id===id))); render(); }
async function deleteCourse(id){
  const inUse = State.colleges.some(c=>c.courses.some(x=>x.courseId===id));
  if(inUse && !confirm('This course is assigned to one or more colleges. Delete it anyway? It will be removed from those colleges too.')) return;
  if(!inUse && !confirm('Delete this course?')) return;
  await deleteCourseRow(id);
  State.catalog = State.catalog.filter(c=>c.id!==id);
  State.colleges.forEach(c=>{ c.courses = c.courses.filter(x=>x.courseId!==id); });
  render(); showToast('Course deleted');
}
function adminCourseEditor(draft){
  const isNew = !draft.id;
  return `
  <div class="admin-topbar"><h2>${isNew?'Add Course':'Edit Course'}</h2><button class="btn btn-ghost" onclick="State.adminEditingCourse=null;render();">← Back to list</button></div>
  <div class="editor-panel">
    <div class="form-grid">
      <div class="field full"><label>Course Name</label><input class="input" id="fc-name" value="${esc(draft.name)}" placeholder="e.g. MBA"/></div>
      <div class="field"><label>Level</label><select id="fc-level"><option ${draft.level==='UG'?'selected':''}>UG</option><option ${draft.level==='PG'?'selected':''}>PG</option><option ${draft.level==='Diploma'?'selected':''}>Diploma</option></select></div>
      <div class="field"><label>Typical Duration</label><input class="input" id="fc-duration" value="${esc(draft.duration)}" placeholder="e.g. 2 Years"/></div>
    </div>
  </div>
  <div style="display:flex;gap:10px;">
    <button class="btn btn-primary" onclick="saveCourseDraft(${isNew})">Save Course</button>
    <button class="btn btn-outline" onclick="State.adminEditingCourse=null;render();">Cancel</button>
  </div>
  <p style="color:var(--slate);font-size:13px;margin-top:14px;max-width:480px;">To assign this course to a college with a specific fee, open the college in <strong>Colleges → Edit</strong> and add it under Courses &amp; Fees.</p>`;
}
async function saveCourseDraft(isNew){
  const name = document.getElementById('fc-name').value.trim();
  if(!name){ showToast('Course name is required'); return; }
  const draft = State.adminEditingCourse;
  const obj = { id: draft.id || uid('crs'), name, level: document.getElementById('fc-level').value, duration: document.getElementById('fc-duration').value.trim() };
  if(isNew) State.catalog.push(obj);
  else State.catalog = State.catalog.map(c=>c.id===obj.id?obj:c);
  await saveCatalog();
  State.adminEditingCourse = null;
  render();
  showToast(isNew?'Course added':'Course updated');
}

/* ---- Admin: Enquiries ---- */
function adminEnquiries(){
  const f = State.enquiryFilters;
  let list = State.enquiries.filter(e=>{
    if(f.status && e.status!==f.status) return false;
    if(f.q){ const q=f.q.toLowerCase(); if(!(e.name.toLowerCase().includes(q)||e.mobile.includes(q)||e.email.toLowerCase().includes(q))) return false; }
    return true;
  });
  return `
  <div class="admin-topbar"><h2>Enquiries</h2></div>
  <div class="admin-toolbar">
    <input class="input" id="enquiry-search-input" placeholder="Search name, mobile or email" value="${esc(f.q)}" oninput="onEnquirySearchInput(this.value)"/>
    <select onchange="State.enquiryFilters.status=this.value;render();">
      <option value="">All statuses</option>
      ${['New','Contacted','Follow-up','Converted','Closed'].map(s=>`<option ${f.status===s?'selected':''}>${s}</option>`).join('')}
    </select>
  </div>
  <div class="admin-table-wrap">
    <table class="admin-table">
      <thead><tr><th>Student</th><th>Contact</th><th>Course</th><th>College</th><th>Date</th><th>Status</th></tr></thead>
      <tbody>
      ${list.map(e=>`<tr>
        <td><strong>${esc(e.name)}</strong>${e.message?`<br><span style="color:var(--slate-light);font-size:12px;">"${esc(e.message.slice(0,40))}${e.message.length>40?'…':''}"</span>`:''}</td>
        <td>${esc(e.mobile)}<br><span style="color:var(--slate-light);font-size:12px;">${esc(e.email)}</span></td>
        <td>${esc(e.course||'—')}</td>
        <td>${esc(e.college||'—')}</td>
        <td>${new Date(e.date).toLocaleDateString('en-IN')}</td>
        <td><select class="status-select" onchange="updateEnquiryStatus('${e.id}', this.value)">
          ${['New','Contacted','Follow-up','Converted','Closed'].map(s=>`<option ${e.status===s?'selected':''}>${s}</option>`).join('')}
        </select></td>
      </tr>`).join('') || `<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--slate-light);">No enquiries match your filters</td></tr>`}
      </tbody>
    </table>
  </div>`;
}
async function updateEnquiryStatus(id, status){
  const e = State.enquiries.find(x=>x.id===id);
  if(!e) return;
  e.status = status;
  try{ const { error } = await sb.from('enquiries').update({ status }).eq('id', id); if(error) throw error; showToast('Status updated'); }
  catch(err){ showToast('Could not save — try again'); }
}

/* ================= INIT ================= */
(function init(){
  State.route = location.hash || '#/';

  // Paint something real IMMEDIATELY — from last-visit cache if we have
  // it, otherwise from the built-in seed data. No network round trip
  // blocks the very first paint anymore.
  const hadCache = loadFromCache();
  if(!hadCache){
    State.catalog = seedCourseCatalog();
    State.colleges = seedColleges();
  }
  render();

  // Then quietly fetch the real data in the background and re-render
  // once it lands (this also refreshes the cache for next time).
  loadAll().then(()=>{ render(); }).catch(()=>{});
})();
</script>
</body>
</html>
